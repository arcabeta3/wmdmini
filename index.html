<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月明洞筆記｜山區景點導覽地圖</title>

<!-- Leaflet 核心 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet 標記叢集插件 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- 字體 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* ===== 設計代碼（淺色山徑系：呼應手繪地圖的米白地與赭石標記）===== */
    --bg:         #faf7f1;   /* 主背景：暖白紙色 */
    --panel:      #ffffff;   /* 卡片/面板底色 */
    --panel-2:    #f1ece0;   /* 面板較深層（hover、輸入框） */
    --border:     #e3dccb;
    --rust:       #1d6b62;   /* 主強調色：深湖水藍綠 */
    --rust-soft:  rgba(29,107,98,0.12);
    --pine:       #6b7a4f;   /* 次要強調色：橄欖苔綠，跟主色區隔開 */
    --pine-dark:  #4c5838;
    --pine-soft:  rgba(107,122,79,0.14);
    --stone:      #8b8377;
    --text:       #2b2622;   /* 主文字：暖炭色，非死黑 */
    --text-muted: #7a7266;
    --danger:     #b3654f;
    --radius:     10px;
    --shadow:     0 10px 28px rgba(43,38,34,0.10);

    /* 手繪地圖分頁專用色彩──宣告在 :root 而不是 #panel-sketch，
       這樣不管元素在 DOM 裡的哪個位置（包含被搬到 body 層級的
       跳出卡片）都讀得到，不會因為變數作用範圍不夠而變透明。 */
    --hm-paper:#FDFCFA; --hm-panel:#F6F4EF; --hm-ink:#22241F;
    --hm-pine:#33422F; --hm-pine-soft:#5B6E52;
    --hm-stone:#8D8577; --hm-stone-soft:#C9C3B6; --hm-accent:#A9754A;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:300;
    overflow:hidden;
  }

  /* ===== 頂部標題列（signature：晨光暈）===== */
  .app-header{
    position:relative;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    border-bottom:1px solid var(--border);
    z-index:20;
    overflow:hidden;
  }
  .app-header::before{
    content:"";
    position:absolute;
    top:-70px; left:38px;
    width:150px; height:150px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(29,107,98,0.16) 0%, rgba(29,107,98,0.04) 55%, transparent 75%);
    filter:blur(2px);
    pointer-events:none;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; position:relative; }
  .brand .zh{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.06em;
    color:var(--rust);
  }
  .brand .sub{
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:.12em;
  }

  /* 語言切換：程式邏輯保留，UI 先隱藏（未來多語需求再開啟） */
  #langSwitch{ display:none; }
  .lang-switch{ display:flex; gap:4px; }
  .lang-switch button{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:'Noto Sans TC', sans-serif;
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    transition:.2s;
  }
  .lang-switch button.active,
  .lang-switch button:hover{
    color:#fff;
    background:var(--rust);
    border-color:var(--rust);
  }

  /* ===== 分頁列 ===== */
  .tabbar{
    display:flex;
    gap:2px;
    padding:0 22px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    z-index:19;
  }
  .tab-btn{
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-family:'Noto Serif TC', serif;
    font-size:14.5px;
    letter-spacing:.05em;
    padding:12px 18px;
    cursor:pointer;
    position:relative;
    transition:color .2s;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:var(--rust); }
  .tab-btn.active::after{
    content:"";
    position:absolute;
    left:14px; right:14px; bottom:0;
    height:2px;
    background:var(--rust);
  }

  .tab-panel{ display:none; height:calc(100vh - 64px - 45px); }
  .tab-panel.active{ display:flex; }

  /* ===== 地圖分頁：側欄 + 地圖 ===== */
  #panel-map{ position:relative; }
  .sidebar{
    width:320px;
    min-width:320px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    z-index:15;
  }
  .sidebar-search{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-search input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:9px 12px;
    font-size:13px;
    font-family:'Noto Sans TC', sans-serif;
  }
  .sidebar-search input::placeholder{ color:var(--text-muted); }

  .spot-list{
    flex:1;
    overflow-y:auto;
    padding:6px 0;
  }
  .spot-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 16px;
    cursor:pointer;
    border-bottom:1px solid rgba(43,38,34,0.05);
    transition:background .15s;
  }
  .spot-item:hover{ background:var(--panel-2); }
  .spot-item.selected{ background:var(--rust-soft); }
  .spot-thumb{
    width:26px; height:26px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--panel-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans TC', sans-serif;
    font-size:11px;
    font-weight:500;
    color:var(--text-muted);
  }
  .spot-info .spot-name{
    font-family:'Noto Serif TC', serif;
    font-size:13.5px;
    color:var(--text);
  }
  .spot-info .spot-cat{
    font-size:11px;
    color:var(--text-muted);
    margin-top:2px;
  }

  #map{ flex:1; background:#eef1e8; }

  /* Leaflet 淺色地圖微調 */
  .leaflet-popup-content-wrapper{
    background:var(--panel);
    color:var(--text);
    border-radius:10px;
    box-shadow:var(--shadow);
  }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-popup-content{ margin:14px 16px; width:240px !important; }
  .popup-title{
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    color:var(--rust);
    margin-bottom:4px;
  }
  .popup-desc{ font-size:12.5px; line-height:1.6; color:var(--text-muted); }
  .popup-imgs{ display:flex; gap:6px; margin-top:8px; }
  .popup-imgs div{
    width:100%; height:60px; border-radius:6px;
    background:linear-gradient(135deg, var(--pine), var(--panel-2));
  }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--text-muted); }

  .my-marker-icon{
    width:12px; height:12px;
    border-radius:50%;
    border:1.5px solid var(--rust);
    background:radial-gradient(circle, rgba(29,107,98,0.85), rgba(29,107,98,0.35));
    box-shadow:0 0 4px 1px rgba(29,107,98,0.3);
  }
  .marker-cluster-custom{
    background:rgba(107,122,79,0.85);
    border:1.5px solid #fff;
    border-radius:50%;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans TC', sans-serif;
    font-size:12px;
    box-shadow:0 2px 8px rgba(43,38,34,0.18);
  }

  /* ===== 相片集 / 影片分頁 ===== */
  .content-scroll{
    width:100%;
    overflow-y:auto;
    padding:26px 30px 60px;
  }
  .section-title{
    font-family:'Noto Serif TC', serif;
    font-size:19px;
    color:var(--rust);
    margin:0 0 4px;
  }
  .section-sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:20px; }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:12px;
  }
  .gallery-card{
    aspect-ratio:4/3;
    border-radius:var(--radius);
    background:linear-gradient(135deg, var(--pine), var(--panel-2));
    display:flex; align-items:flex-end;
    padding:10px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    border:1px solid var(--border);
    transition:transform .18s;
  }
  .gallery-card:hover{ transform:translateY(-3px); }
  .gallery-card span{
    font-size:12px;
    color:#fff;
    background:rgba(43,38,34,0.55);
    padding:3px 8px;
    border-radius:5px;
  }

  .terrain-block{ max-width:640px; margin-bottom:32px; }
  .terrain-image{
    width:100%; aspect-ratio:16/9; border-radius:var(--radius);
    background:linear-gradient(135deg, var(--pine), var(--panel-2));
    margin-bottom:12px;
  }
  .terrain-block h4{
    font-family:'Noto Serif TC', serif;
    font-size:16px; color:var(--rust); margin:0 0 8px;
  }
  .terrain-block p{ font-size:14px; line-height:1.8; color:var(--text-muted); margin:0; }

  /* 燈箱 */
  .lightbox{
    position:fixed; top:109px; left:0; right:0; bottom:0; background:rgba(43,38,34,0.75);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  .lightbox.show{ display:flex; }
  .lightbox-inner{
    width:min(80vw,700px); aspect-ratio:4/3;
    background:linear-gradient(135deg, var(--pine), var(--pine-dark));
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Noto Serif TC', serif; font-size:16px;
    position:relative;
  }
  .lightbox-close{
    position:absolute; top:-38px; right:0;
    background:none; border:none; color:var(--text); font-size:26px; cursor:pointer;
  }

  /* 捲軸美化 */
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  @media (max-width:760px){
    .sidebar{ position:absolute; left:0; top:0; bottom:0; z-index:30; transform:translateX(-100%); transition:.25s; }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-toggle{
      position:absolute; top:10px; left:10px; z-index:25;
      background:var(--panel); border:1px solid var(--border); color:var(--text);
      border-radius:8px; padding:8px 10px; cursor:pointer;
      box-shadow:var(--shadow);
    }
  }

  /* ===================================================================
     手繪地圖分頁（精選導覽）── 獨立視覺語言，不套用主題色，維持原始
     手繪藝術風格。所有選取器限定在 #panel-sketch 或 hm- 前綴 class 內，
     避免跟主題其他分頁互相干擾。
     =================================================================== */
  #panel-sketch{
    background:var(--hm-paper); color:var(--hm-ink);
    position:relative; width:100%; height:100%; overflow:hidden;
  }
  .hm-map-wrap{ position:relative; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 50%, #fff 0%, #F1EEE7 100%); cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .hm-map-wrap.dragging{ cursor:grabbing; }
  .hm-map-viewport{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:24px; transform-origin:0 0; will-change:transform; }
  .hm-map-viewport.animating{ transition:transform .28s ease; }
  .hm-marker-layer{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; touch-action:none; }
  .hm-zoom-controls{ position:absolute; right:16px; bottom:16px; z-index:25; display:flex; flex-direction:column; gap:6px; }
  .hm-zoom-controls button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--hm-stone-soft); background:rgba(253,252,250,.95); box-shadow:0 4px 12px rgba(0,0,0,.15); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--hm-pine); }
  .hm-zoom-controls button:hover{ background:#fff; border-color:var(--hm-accent); color:var(--hm-accent); }
  .hm-zoom-hint{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:20; font-size:11px; color:var(--hm-stone); background:rgba(253,252,250,.9); padding:4px 10px; border-radius:999px; border:1px solid var(--hm-stone-soft); pointer-events:none; opacity:.9; transition:opacity .4s ease; }
  .hm-zoom-hint.hide{ opacity:0; }
  .hm-map-stage{ position:relative; width:100%; max-width:1200px; overflow:hidden; box-shadow:0 10px 30px rgba(51,66,47,.12); border:1px solid var(--hm-stone-soft); background:#EDEAE2; }
  .hm-map-image{ position:absolute; top:0; left:0; width:100%; height:auto; display:block;
    -webkit-user-drag:none; user-drag:none; -webkit-user-select:none; user-select:none; pointer-events:none; }

  .hm-marker{ position:absolute; width:14px; height:14px; transform:translate(-50%,-50%); cursor:pointer; z-index:5; pointer-events:auto; }
  .hm-marker svg{ width:100%; height:100%; overflow:visible; }
  .hm-marker .hm-ring{ fill:rgba(51,66,47,.10); stroke:var(--hm-pine); stroke-width:1.2; }
  .hm-marker:hover .hm-ring{ fill:rgba(169,117,74,.28); stroke:var(--hm-accent); }
  .hm-marker-tag{ position:absolute; top:100%; left:50%; transform:translate(-50%,1px); font-size:9px; line-height:1; color:var(--hm-pine); background:rgba(253,252,250,.78); padding:1px 3px; border-radius:2px; pointer-events:none; white-space:nowrap; opacity:0; transition:opacity .15s ease; }
  .hm-marker-layer.labels-on .hm-marker-tag{ opacity:1; }
  @media (min-width: 700px){ .hm-marker-tag{ opacity:1; } }
  .hm-marker.symbol .hm-ring{ stroke:var(--hm-pine-soft); stroke-dasharray:2,1.4; }

  .hm-marker.cluster{ width:26px; height:26px; z-index:6; }
  .hm-cluster-bubble{ width:26px; height:26px; border-radius:50%; background:var(--hm-accent); color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.28); border:2px solid rgba(255,255,255,.9); }
  .hm-marker.cluster:hover .hm-cluster-bubble{ background:var(--hm-pine); }
  .hm-marker-tooltip{ position:absolute; bottom:100%; left:50%; transform:translate(-50%,-4px); background:var(--hm-ink); color:#fff; font-size:11px; padding:4px 8px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:20; }
  .hm-marker:hover .hm-marker-tooltip{ opacity:.95; }

  /* 跳出式底部抽屜（手機）／右側面板（桌面）── 跟主地圖的抽屜互動邏輯一致 */
  .hm-modal-backdrop{ position:fixed; top:109px; left:0; right:0; bottom:0; background:rgba(34,36,31,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .hm-modal-backdrop.show{ opacity:1; pointer-events:auto; }
  .hm-modal-card{ background:var(--hm-panel); width:100%; max-width:560px; max-height:86vh; overflow-y:auto; border-radius:20px 20px 0 0; position:relative; box-shadow:0 -12px 40px rgba(0,0,0,.3); transform:translateY(100%); transition:transform .32s ease; }
  .hm-modal-backdrop.show .hm-modal-card{ transform:translateY(0); }
  @media (min-width: 700px){
    .hm-modal-backdrop{ align-items:stretch; justify-content:flex-end; }
    .hm-modal-card{ width:420px; max-width:420px; height:100%; max-height:100%; border-radius:0; box-shadow:-12px 0 40px rgba(0,0,0,.3); transform:translateX(100%); }
    .hm-modal-backdrop.show .hm-modal-card{ transform:translateX(0); }
  }
  .hm-modal-drag-handle{ position:sticky; top:0; display:flex; justify-content:center; padding:8px 0 4px; background:var(--hm-panel); z-index:2; }
  .hm-modal-drag-handle span{ width:36px; height:4px; border-radius:99px; background:var(--hm-stone-soft); display:block; }
  .hm-modal-close{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(255,255,255,.9); color:var(--hm-ink); font-size:18px; cursor:pointer; z-index:5; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .hm-gallery-main{ width:100%; aspect-ratio:4/3; background:linear-gradient(135deg,#DCD6C7,#EDEAE2); display:flex; align-items:center; justify-content:center; color:var(--hm-stone); font-size:12px; border-radius:20px 20px 0 0; background-size:cover; background-position:center; }
  .hm-gallery-thumbs{ display:flex; gap:6px; padding:8px 10px; overflow-x:auto; background:var(--hm-panel); border-bottom:1px solid var(--hm-stone-soft); }
  .hm-gallery-thumbs img{ width:52px; height:52px; object-fit:cover; border-radius:4px; cursor:pointer; border:2px solid transparent; flex:0 0 auto; }
  .hm-gallery-thumbs img.active{ border-color:var(--hm-accent); }
  .hm-panel-body{ padding:22px 26px 32px; font-family:'Noto Sans TC', sans-serif; }
  .hm-panel-eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--hm-accent); margin-bottom:6px; }
  .hm-panel-title{ font-family:'Noto Serif TC', serif; font-size:22px; font-weight:600; color:var(--hm-pine); margin:0 0 10px; }
  .hm-panel-rule{ border:none; border-top:1px solid var(--hm-stone-soft); margin:12px 0 16px; }
  .hm-panel-desc{ font-size:14px; line-height:1.9; color:var(--hm-ink); white-space:pre-line; }

  .hm-toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--hm-pine); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s ease; pointer-events:none; z-index:100; }
  .hm-toast.show{ opacity:1; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="zh">月明洞筆記</span>
    <span class="sub" data-i18n="subtitle">山區景點導覽地圖</span>
  </div>
  <div class="lang-switch" id="langSwitch">
    <button data-lang="zh" class="active">中</button>
    <button data-lang="en">EN</button>
    <button data-lang="ko">한</button>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tab="panel-sketch">精選導覽</button>
  <button class="tab-btn" data-tab="panel-map">地圖導覽</button>
  <button class="tab-btn" data-tab="panel-terrain">地形導覽</button>
  <button class="tab-btn" data-tab="panel-exhibit">特展</button>
</nav>

<!-- ============ 精選導覽分頁（手繪地圖，現為主要導覽）============ -->
<section class="tab-panel active" id="panel-sketch">
  <div class="hm-map-wrap" id="hmMapSection">
    <div class="hm-map-viewport" id="hmMapViewport">
      <div class="hm-map-stage" id="hmMapStage">
        <img class="hm-map-image" id="hmMapImage" src="bg.webp" alt="手繪地圖底圖">
      </div>
    </div>
    <div class="hm-marker-layer" id="hmMarkerLayer"></div>
    <div class="hm-zoom-controls">
      <button id="hmZoomInBtn" title="放大">＋</button>
      <button id="hmZoomOutBtn" title="縮小">－</button>
      <button id="hmZoomResetBtn" title="回到整張地圖">⤢</button>
    </div>
    <div class="hm-zoom-hint" id="hmZoomHint">雙指放大地圖，靠近後會顯示景點編號</div>
  </div>
</section>

<!-- ============ 地圖分頁（真實 GPS，現在只標大範圍地形：山、谷、稜線）============ -->
<section class="tab-panel" id="panel-map">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="搜尋地形名稱…" />
    </div>
    <div class="spot-list" id="spotList"></div>
  </aside>
  <div id="map"></div>
</section>

<!-- ============ 地形導覽分頁：純文字＋圖片，介紹地形特色，不是地圖 ============ -->
<section class="tab-panel" id="panel-terrain">
  <div class="content-scroll">
    <h2 class="section-title">地形導覽</h2>
    <p class="section-sub">認識月明洞的山勢地形與環境特色</p>
    <div id="terrainContainer"></div>
  </div>

  if(!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).classList.add('active');
  if(btn.dataset.tab === 'panel-map'){ setTimeout(()=>map.invalidateSize(), 50); }

});

document.getElementById('langSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');

  btn.classList.add('active');
  applyI18n();
  renderSpotList();
  renderTerrain();
  renderExhibit();
});
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
  });
  document.getElementById('searchInput').placeholder = i18n[currentLang].searchPh;
}

/* ===== Leaflet 地圖初始化 ===== */
const map = L.map('map', { zoomControl:true, minZoom:13, maxZoom:19 })
  .setView([36.123801, 127.369305], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; OpenStreetMap contributors',
  maxZoom:19
}).addTo(map);

const clusterGroup = L.markerClusterGroup({
  iconCreateFunction: function(cluster){
    return L.divIcon({
      html: '<div class="marker-cluster-custom" style="width:'+Math.min(28+cluster.getChildCount()*1.1,46)+'px;height:'+Math.min(28+cluster.getChildCount()*1.1,46)+'px;">'+cluster.getChildCount()+'</div>',
      className: '', iconSize: L.point(32,32)
    });
  }
});

const spotMarkers = {};
let searchTerm = "";

function makeIcon(){
  return L.divIcon({ className:'', html:'<div class="my-marker-icon"></div>', iconSize:[12,12] });
}

function buildPopupHTML(spot){
  const imgsHtml = spot.images.map(label=>`<div title="${label}"></div>`).join('');
  return `
    <div class="popup-title">${spot.name[currentLang]}</div>
    <div class="popup-desc">${spot.desc[currentLang]}</div>
    <div class="popup-imgs">${imgsHtml}</div>
  `;
}

function rebuildMarkers(){
  clusterGroup.clearLayers();
  Object.keys(spotMarkers).forEach(k=>delete spotMarkers[k]);
  spotsData.forEach(spot=>{
    const marker = L.marker([spot.lat, spot.lng], { icon: makeIcon() });
    marker.bindPopup(buildPopupHTML(spot));
    marker.on('click', ()=> highlightSpot(spot.id, false));
    spotMarkers[spot.id] = marker;
    clusterGroup.addLayer(marker);
  });
  map.addLayer(clusterGroup);
}
rebuildMarkers();

function highlightSpot(id, flyTo=true){
  document.querySelectorAll('.spot-item').forEach(el=>el.classList.remove('selected'));
  const el = document.querySelector(`.spot-item[data-id="${id}"]`);
  if(el){ el.classList.add('selected'); el.scrollIntoView({block:'nearest'}); }
  const spot = spotsData.find(s=>s.id===id);
  if(spot && flyTo){
    map.flyTo([spot.lat, spot.lng], 17, { duration:0.6 });
    spotMarkers[id].openPopup();
  }
}

  const list = document.getElementById('spotList');
  list.innerHTML = '';
  const filtered = spotsData.filter(s=>{

  });
  filtered.forEach((spot, i)=>{
    const item = document.createElement('div');
    item.className = 'spot-item';
    item.dataset.id = spot.id;
    item.innerHTML = `
      <div class="spot-thumb">${String(i+1).padStart(2,'0')}</div>
      <div class="spot-info">
        <div class="spot-name">${spot.name[currentLang]}</div>
      </div>`;
    item.onclick = ()=> highlightSpot(spot.id, true);
    list.appendChild(item);
  });
}

  },
  {key:"pt22", x:36.6, y:37.6, label:"22", name:"老家紀念館",
    desc:"原為老師出生的茅草屋。1970年代老師曾夢見這塊地是埋有金碗的王陵，體會到這將作為神的宮殿使用。老師用傳道奉獻買下土地並改建。時機成熟後，在此興建了老家紀念館，接待傳道者與貴賓，館內展示許多老師手稿。這見證了神階段性提升福音層次的計畫，完全按照全能神的構想來開發成就。"
  },
  {key:"pt23",x:33.8,y:35.5,label:"23",name:"禱告洞"},
  {key:"pt24", x:31.5, y:36.4, label:"24", name:"山泉水",
    desc:"「真心地告白你的願望之後再喝吧！」\n草皮下方的山泉水於1997年建造成如今的樣貌，旁邊的禱告洞內也同樣湧流著山泉水。這裡的水含氧量極高，飲用時帶著舒暢的清涼感。\n這是三位為了讓攝理史所有人保持健康，當成恩典所賜下的禮物，已有數千人因飲用山泉水而得醫治。只要相信這水，並堅定認定自己絕對會痊癒，就能發揮出更大的治癒效果。"
  },
  {key:"pt25", x:27.9, y:34.7, label:"25", name:"草坪聖殿",
    desc:"草坪原本只是一塊泥濘的田。老師在上面鋪設草皮，並保留原有的坡度，依照地形特質將其打造成「可以坐下來的地方」，讓人們在這裡不僅能看清楚，也能聽得清楚。\n這座「草坪聖殿」是老師按照各處地形的位置、大小、寬窄與尖細等特質，進行精細處理與構想，進而完成與大自然相符的完美第二創造。"
  },
  {key:"pt26",x:14.6,y:31.3,label:"26",name:"景點26"},
  {key:"pt27", x:18.7, y:29.8, label:"27", name:"草坪山水景石",
    desc:"所謂的「山水景石」是彷彿將自然景觀縮小的奇石。2021年底，老師詢問神今年是否有要賜下的禮物，聖靈引導他在「月明洞的石頭當中」尋找。頂著零下10度嚴寒，老師在草坪發現了這顆像山的石頭。挖除周邊花樹後，石頭露出長達13公尺、呈S型的壯麗模樣。若連同旁邊的「駱駝石」一起看，整體呈現出總長50公尺的山水景石。聖靈藉此賜下了令人大吃一驚、讚嘆不已的珍貴作品。"
  },
  {key:"pt28",x:26.3,y:58.2,label:"28",name:"信心山"},
  {key:"pt46",x:28.3,y:40.2,label:"46",name:"聖子雕像"},
  {key:"pt29",x:30.4,y:42.3,label:"29",name:"第一瀑布"},
  {key:"pt30", x:33.2, y:50.2, label:"30", name:"野心作",
    desc:"＜野心作＞象徵「神的白寶座」，是唯有神才擁有的權柄。全長200公尺，由稀有的虎皮石堆疊而成。開發初期，老師本想建水泥階梯，但神賜下構想要求用石頭造景。野心作前還豎立了大象、老虎、人老鷹、駱駝四個形像石，宛如天國寶座前的四活物。這提醒我們，不論做什麼都應詢問神的旨意，與神一同行動。"
  },
  {key:"pt31",x:34.7,y:51.6,label:"31",name:"老鷹石"},
  {key:"pt32",x:39,y:68,label:"32",name:"神之亭"},
  {key:"pt33", x:40.5, y:65.6, label:"33", name:"神的瀑布",
    desc:"打造湖泊上方的〈神的瀑布〉是極具危險的絕壁工程。因腹地狹窄，老師與弟子們將山上岩石削平、如豎立刀子般好不容易才堆起石頭。為了紀念神透過老師「用筆寫下無數屬天箴言」，造景中更特別融入了「筆的形狀」。\n這座瀑布雖然受限於條件而無法做得太大，卻是一件「大作品」。因為瀑布與下方扮演水盆角色的湖泊完美諧調，更讓原本寧靜的湖水，因瀑布的注入而成為充滿生命力的「活著的湖泊」！"
  },
  {key:"pt34",x:54,y:23.1,label:"34",name:"田谷"},
  {key:"pt35",x:35.2,y:8.6,label:"35",name:"展望台"},
  {key:"pt36",x:84,y:55,label:"36",name:"城隍堂"},
  {key:"pt37",x:68.4,y:41.2,label:"37",name:"星峰亭"},
  {key:"pt38", x:64.5, y:42.1, label:"38", name:"王之座椅松",
    desc:"這棵松樹向後傾斜、左邊有扶手，完美呈現「王之座椅」形像。為買下此山，老師曾在樹下埋紙條並晨禱四十天，最後奇蹟般買下。小時候老師常跨過這棵樹的樹枝，直到它長大才顯出傑作模樣。聖靈教導，連一棵樹神都會寫下故事，人也一樣，從小給予教導並懷抱希望栽培，成長後就能成為大人物。"
  },
  {key:"pt39",x:63.5,y:40.6,label:"39",name:"另一顆松樹"},
  {key:"pt41",x:38.4,y:79.4,label:"41",name:"清算館"},
  {key:"pt42",x:18.8,y:20.8,label:"42",name:"圓山多福松"},
  {key:"pt43",x:26.2,y:20.7,label:"43",name:"Ｙ字松"},
  {key:"pt44", x:39.1, y:36.8, label:"44", name:"構想松 (四位一體松)",
    desc:"聖靈引導老師觀察這棵被雜枝遮住的樹，修剪後看見四根帥氣大樹枝合為一體往四方延伸，上半部是紅松，下半部是土松。這四根分枝象徵「神、聖靈、聖子與我們」四位一體，也代表東西南北和諧的自然聖殿。聖靈教導，必須剪除神不喜悅的肉體錯誤與矛盾，肉、魂、靈才能發光，明白自己也是寶貴的傑作。"
  },
  {key:"pt45", x:41.4, y:29.5, label:"45", name:"禱告神蹟松",
    desc:"這是一棵見證禱告神蹟的復活松樹。老師小時候常在下雪時於此樹下禱告，並向原主人承諾交換才保留下來。後來後山發生大火，松樹被燒得黑漆漆。老師本想砍下，但神感動說：「不要砍掉，為它禱告吧！」隔年樹上竟奇蹟似長出新芽。這告訴我們：「禱告吧！面對信仰死去的人，也要透過禱告讓他們活過來。」"
  },
  {key:"pt47", x:44.1, y:68.1, label:"47", name:"駱駝石",
    desc:"老師懇求神賜下500噸以上能讓人讚嘆的紀念大石。某日受感動挖開泥土，赫然發現這顆重超過500噸、呈現走路模樣的「駱駝石」。正如東方博士騎駱駝迎接耶穌，神說這石頭載著寶貴的見證者與敬拜者來到此地，象徵新婦與大人物的誕生。這龐大萬物成為神的言語，將在千年歷史中長久見證神蹟。"
  },
  {key:"pt48", x:44.1, y:68.1, label:"48", name:"野心作石",
    desc:"象徵「神老鷹」的寶貴禮物，其喙如老鷹，眼嘴如神的莊嚴樣貌。石頭搬回後神隱藏了24年，直到老師為解決樹木遮蔽，將白寶座周圍清理乾淨、鋪上白石後，才看出其形像。聖靈透過清理樹木教導：「讓象徵神身軀的肉體和內心也變得潔淨吧！」提醒我們必須處理根本的矛盾，以潔淨精神來造就自己。"
  },
  {key:"pt49", x:44.1, y:68.1, label:"49", name:"時代伊甸園",
    desc:"月明洞是三位為讓人迎接聖子而建造的最棒構想作品。這裡是天下要塞，地形蘊含白寶座、火山口等奇妙形像。大自然如男人，石頭與樹木如女人。周圍山脈象徵神與聖子的手，前山如同「保護的左手」，印學山則是「打倒撒但的右手」。這裡將湧出生命江河，是神救援歷史完結之地與美麗理想世界。"
  },
  {key:"pt50", x:44.1, y:68.1, label:"50", name:"聖靈路",
    desc:"聖靈路有七個S形彎道，是神因愛而賜下的小徑。這裡原是老師20年來前往山谷禱告的必經之路。老師與聖靈討論後著手開發，歷經泥土路、碎石路到鋪設柏油，每逢下雨沖毀便再次修補，過程艱辛。聖靈說，這是為紀念老師禱告之路而開出的美麗小徑。日落時分晚霞絕美，提醒眾人體會三位賜下此路的深刻愛情。"
  },
  {key:"pt51", x:44.1, y:68.1, label:"51", name:"千金榆",
    desc:"位於禱告山，是一棵歷經森林大火仍存活的稀有樹根王。高達八公尺，擁有六種神奇形像。老師在感動下挖開泥土，才驚見其寶貴特徵。神與聖靈藉此教導，如同千金榆在背陽地也能將根扎得深廣，內心如沃土的人在任何環境都能讓信仰深深扎根。神呼籲每個人都要找出自己的特色，成為被寶貴使用的人才。"
  },
  {key:"pt52", x:44.1, y:68.1, label:"52", name:"軍人石",
    desc:"老師在海外時依聖子指示，在溪谷撿回的奇石。正面是「戴鋼盔的軍人仰頭」，背面則是「笑臉」。聖子表示這是特地預備的紀念，蘊含「不僅要像軍人大膽威嚴，也要總是笑著生活」的含意。這證明了即使數萬人經過，若不明白價值便無法得著，唯有體會神旨意的人能獲得珍寶。"
  },
  {key:"pt53", x:44.1, y:68.1, label:"53", name:"世紀風暴",
    desc:"1999年底法國為迎接千禧年準備慶典，卻遭遇時速300公里的強勁暴風襲擊。數百萬戶斷電，凡爾賽宮六千棵百年老樹被連根拔起，死傷慘重。這場世紀風暴發生在老師於歐洲舉辦活動之後，老師見證這應驗了聖經「末世審判」。神將大自然萬物當作使者進行審判，提醒世人面對末世應保持敬畏。"
  },
  {key:"pt54", x:44.1, y:68.1, label:"54", name:"福音的開始",
    desc:"「救援」是當神差派之人傳揚生命話語時，人們能相信、體會並悔改。1978年5月，老師帶著如「拯救時代糧食」的圖表與屬天祕密，離開月明洞前往首爾。從三角山到三仙橋的5坪小房間，福音歷史一步步拓展。這段艱辛的開創過程，是將福音扎根於核心地帶、展開拯救生命的偉大起點。"
  },
  {key:"pt55", x:44.1, y:68.1, label:"55", name:"阿拉法節",
    desc:"1978年6月1日是老師首度傳揚聖子賜下「新福音」的日子，命名為「阿拉法節」。當年聖子催促老師務必在6月1日前抵達首爾。聖子表示，首爾是政治與年輕人聚集的核心地，如同長大的魚會游向大海，必須在這核心地引爆話語的原子彈。這天成為了將生命話語傳向全世界的歷史性開端。"
  },
  {key:"pt56", x:44.1, y:68.1, label:"56", name:"錦山衛星通訊",
    desc:"月明洞位於海拔400至600公尺高處，比韓國許多大都市都高。鄰近的錦山平地也有250公尺，正因地勢居高臨下，才安裝了如體育館般巨大的宇宙衛星通信天線。神將這高處當作「講台」與「寶座」，透過時代被差來者，將新時代成約話語如衛星訊號般向全世界廣泛宣達，展現了神偉大的安排。"
  },
  {key:"pt57", x:44.1, y:68.1, label:"57", name:"地形模樣和形像",
    desc:"月明洞蘊含了21種奇妙形像。整體猶如高聳火山口與勝利獎盃；由五個山谷交織成星星與老鷹形像。從高空俯瞰宛如盛開牡丹，具備左青龍右白虎的寶地格局。周圍山脈勾勒出女人側臥、男人的形像，還包含白寶座與開心跳躍之人的模樣。證明月明洞是神精心雕琢、蘊藏無限恩典的時代聖殿。"
  },
  {key:"pt58", x:44.1, y:68.1, label:"58", name:"作品王松樹",
    desc:"老師清理聖靈瀑布後，聖靈賜下樹根完美分成六條的「作品王松樹」。神賜下作品，但挖開泥土、修剪雜枝則是人的責任。清理後，樹根展現出百倍價值與光芒。聖靈教導，我們也必須剪除錯誤與矛盾，讓自己變得潔淨，才能展現最美麗的本質。這棵稀有松樹鼓勵大家每天與聖靈同行，造就自我。"
  },
  {key:"pt59", x:44.1, y:68.1, label:"59", name:"愛之松",
    desc:"種在野心作白寶座的「愛之松」，原是墳墓旁的美麗紅松。總裁用心照料三年，感動管理者贈與。因出於愛而移植故得此名。當前山造景倒塌時，它奇蹟般毫髮無傷，被稱為生命神蹟樹。聖子教導：「照顧過的就會是你的」，勉勵我們對傳道的生命也要提早栽培。它蘊含著永不放棄的愛與神蹟保護。"
  },
  {key:"pt60", x:44.1, y:68.1, label:"60", name:"樹根王松樹",
    desc:"這棵曾倒下的松樹擁有月明洞最頂級的粗壯樹根。老師得聖靈啟示，不蓋住樹根而是輕壓泥土，讓三條巨根四處延伸，呈現「青蛙跳」與「人屈膝」兩種形像，連盆栽專家都驚嘆為無價之寶。這象徵在患難中倒下的人，若讓信仰樹根不斷成長，最終也能成為連人工都難以雕琢的大傑作。"
  },
  {key:"pt61", x:44.1, y:68.1, label:"61", name:"耶和華以勒松",
    desc:"北邊造景於1998年完美堆砌，神指示繞著柿子樹堆疊，保留了後來青瓦屋的基地。老師原想移植一棵黑松卻發現被雪壓垮，神安慰說已預備更好的，老師才在附近找到被葛藤掩埋的「佳緣紅松」。這正是「耶和華以勒」，神總為我們預備更美的事物，期勉我們成為堅固且絕對信靠神的人。"
  },
  {key:"pt62", x:44.1, y:68.1, label:"62", name:"月明洞開發",
    desc:"月明洞是神賜下的愛之禮物。開發過程經歷了難以想像的艱辛，購買作品松樹需耗費數年並獲神幫助。土木工程面臨無數法規限制，需耐心等待。堆疊巨石時遭遇多次倒塌與生命危險，但大家依然憑信心堅持到底。神宮殿中的一草一木皆是血汗與神蹟的結晶，應當懷著感恩的心，在此祈求並珍惜使用。"
  },
  {key:"pt63", x:44.1, y:68.1, label:"63", name:"老鷹盆栽松",
    desc:"從岩盤縫隙中挖出存活的頂級松樹，樹幹呈S型彎曲，雙翼向左右展開，擁有完美老鷹形像。為了將它買回聖殿，老師與同行者鍥而不捨說服原不想販售的主人，終在神與聖靈動工下成功。神藉此教導：「別光是禱告，去買樹木吧！」勉勵我們得到感動就要化為實際行動，將珍貴作品帶回神的殿中。"
  },
  {key:"pt64", x:44.1, y:68.1, label:"64", name:"野心作紀念碑",
    desc:"野心作歷經五次倒塌，第六次完工時，在前山立下高35公尺的紀念碑。耶穌指示將一顆好石頭對半切開豎立。1996年冬，老師依夢中「舊事物將被埋葬」的啟示，頂著大雪推動工程，完工隔日聖殿便覆滿白雪。碑文寫道：「這一切構想來自於神，感動來自於聖靈，實踐則是我和弟子們。」"
  },
  {key:"pt65", x:44.1, y:68.1, label:"65", name:"時代的伊甸園",
    desc:"月明洞是神做新事的「這時代伊甸園」。神保留大自然原貌，將這座海拔四百公尺的小山丘開發為伊甸園。這是神在太初創造天地、火山爆發時就預定好的完美地形。月明洞由六座山丘組成，呈現五女一男形像。亞當與耶穌時代未能打造的伊甸園，終於在此時由被差來者開發完成，成為神聖的美麗聖地。"
  },
  {key:"pt66", x:44.1, y:68.1, label:"66", name:"「愛生命吧」石",
    desc:"刻有攝理史宗旨「愛生命吧」的石頭，見證了耶和華以勒的預備。1997年村莊發生示威阻礙工程，老師在苦惱中聽見耶穌的聲音：「石頭放著不管不會怎樣，但放著生命不管轉眼就會消失。」老師因而放下屬肉的伊甸園工程，展開四個月的全國巡迴，成功拯救三千名生命，展現打理「生命伊甸園」的最高價值。"
  },
  {key:"pt67", x:44.1, y:68.1, label:"67", name:"奇石條件",
    desc:"判斷奇石的價值，需觀察硬度、磨蝕程度、形像及產地。南漢江石硬度極高，但需具備明確形像才算奇石。即使尺寸微小，若有聖經人物形像或深刻故事，依然極為寶貴；若具備絕妙模樣，則越大越有價值。奇石之美在於天然紋樣與水流沖刷的圓潤，是耗費漫長歲月雕琢、極具屬靈意義的珍貴藝術品。"
  },
  {key:"pt68", x:44.1, y:68.1, label:"68", name:"月明石",
    desc:"歷經數億年形成的卓越庭園石。弟子立下傳道百人的條件後，奇蹟似地以極低廉價格買回。擁有天池、七座山峰、火山口等多種神奇形像，甚至具備高大女人的優雅模樣。神表示，為打造這顆形像石耗費無數歲月，若隨便展示就失去價值，僅獻給立下生命條件的人觀賞，是神無限恩典的具體展現。"
  },
  {key:"pt69", x:44.1, y:68.1, label:"69", name:"生命石",
    desc:"老師初見時覺得尺寸不合適，聖靈提醒：「配合石頭吧！要配合神賜下的東西。」體會後發現它擁有二十多個優點：硬度高、黃金比例、具備五座峰與天池，外貌宛如生命樹，最終安放於神殿玄關。這教導我們，看神的歷史不要只憑自身水準，應放下成見配合神早已成就的旨意，便能看見無盡恩典。"
  },
  {key:"pt70", x:44.1, y:68.1, label:"70", name:"鐵甲王松",
    desc:"這是一棵樹皮如鐵甲般堅硬的岩盤故事松。因在強風與貧瘠岩石中奮力掙扎，造就了其堅韌的傑作外型。聖靈說：「它披上了最好的外衣。」象徵在艱難環境中堅持到底的攝理人，最終也能成為大傑作。依附主這磐石成長，每個人都能成為特質的王。期勉大家善用神賜的禮物，成為千年歷史的偉大作品。"
  },
  {key:"pt71", x:44.1, y:68.1, label:"71", name:"月明洞（新詩作）",
    desc:"＜月明洞＞新詩作（2017年）。這片寶貴之地是神、聖靈與聖子賜予的禮物，耗費漫長歲月與艱辛才建造而成。我們應當扎實、珍惜地使用它，不斷打磨讓這地發光。正如開發月明洞的過程，我們也必須一再造就自己的內心與行為，使生命變得和諧、美麗又充滿奧秘，才能成為被神寶貴使用的人才。"
  },
  {key:"pt72", x:44.1, y:68.1, label:"72", name:"月明洞 神的宮殿",
    desc:"動工前九十年，神便引導老師祖父定居於此。老師從1960年代起在山中深切禱告，領受高層次話語。1978年帶著圖表前往首爾開啟新篇章。1980年代，老師應許要為眾人打造寬敞聖殿並默默買地。1990年代起正式推動大規模土木工程，歷經三十年成長，昔日荒地已成為傳道生命、讚美神的偉大宮殿。"
  },
  {key:"pt73", x:44.1, y:68.1, label:"73", name:"唯有向主學習吧",
    desc:"1970年代老師在月明洞禱告時，神指示要在此展開世界歷史。當時雖只見貧瘠現實，老師仍憑信心買下老家與周邊山地。隨後神賜下堆疊前山、建造野心作的構想。老師懷抱未來希望去實踐，將荒地打造成能容納十萬人的自然聖殿。這教導我們，不要因眼前困境灰心，只要展望未來，靈肉都能度過充滿成就感的生活。"
  },
  {key:"pt74", x:44.1, y:68.1, label:"74", name:"野心作石頭造景",
    desc:"＜野心作＞是將三位一體的構想完美呈現的大傑作，象徵堅定的攝理人。在堆疊過程中，造景曾倒塌多達五次。老師雖感失望卻依然重新挑戰，到了第六次，終於用買都買不到的頂級石頭堆出雄壯聖殿。這證明只要將神吩咐的事堅持到底，神必會同在並成就旨意。我們的心智也當如這野心作一般堅固。"
  },
  {key:"pt75", x:62.5, y:58, label:"75", name:"喜鵲櫸樹",
    desc:"這棵樹是1997年老師生日時，從鎮安龍潭地區運來的禮物。剛運抵時，樹枝上還附著一個喜鵲巢。在韓國，喜鵲是象徵帶來好消息的吉祥動物。\n這是一棵可供人們休憩的行道樹。老師特別喜愛能帶給人益處的樹木：第一是開花悅人眼目的樹；第二是綠意盎然能供人乘涼的樹；第三則是如松樹般散發香氣、充滿韻味，象徵堅毅不拔與節操的樹。"
  },

  {key:"pt76", x:62.5, y:58, label:"76", name:"運動場",
    desc:"這是一座能舉辦各種活動的寬闊運動場。過去只要一下雨，運動場的泥土就會變得泥濘不堪。在疫情期間，即便無人造訪月明洞，老師仍與三位一同推動了龐大的排水工程。\n這項浩大的工程耗時五十天，動用了高達十八萬人次的人力（包含一台挖土機抵過一千人次的辛勞）。老師與弟子們齊心協力完成了這項大工程，如今這座嶄新的運動場正期待、等著你們的到來。"
  }
  ].map(s => ({ desc:"【站位文字】"+s.name+"的介紹內容，之後替換為正式文案。", photos:[], ...s }));

  const HM_SYMBOLS = [
    {key:"toilet-1", type:"symbol", x:38, y:83.7, label:"廁", name:"洗手間"},
    {key:"toilet-2", type:"symbol", x:49.9, y:80.5, label:"廁", name:"洗手間"},
    {key:"horse", type:"symbol", x:23.3, y:1.2,  label:"馬", name:"騎馬場入口"},
    {key:"routeA", type:"symbol", x:51, y:74.8, label:"A起", name:"路線A 出發點"},
    {key:"routeB", type:"symbol", x:59.3, y:62.4, label:"B起", name:"路線B 出發點"},
    {key:"spring", type:"symbol", x:47.4, y:40.7, label:"C起點路線",  name:"青瓦屋前"}
  ].map(s => ({ desc:"【站位文字】"+s.name+"的介紹內容，之後替換為正式文案。", photos:[], ...s }));

  const HM_ALL = [...HM_SPOTS, ...HM_SYMBOLS];
  const HM_BASE_W = 4000, HM_BASE_H = 2500;

  const hmMapStage=document.getElementById("hmMapStage"), hmMapImage=document.getElementById("hmMapImage");
  const hmMapViewport=document.getElementById("hmMapViewport"), hmZoomHintEl=document.getElementById("hmZoomHint");
  const hmMarkerLayer=document.getElementById("hmMarkerLayer");
  const hmMapSection=document.getElementById("hmMapSection");
  const hmModalBackdrop=document.getElementById("hmModalBackdrop");
  const hmGalleryMain=document.getElementById("hmGalleryMain"), hmGalleryThumbs=document.getElementById("hmGalleryThumbs");
  const hmPanelEyebrow=document.getElementById("hmPanelEyebrow"), hmPanelTitle=document.getElementById("hmPanelTitle"), hmPanelDesc=document.getElementById("hmPanelDesc");
  const hmToastEl=document.getElementById("hmToast");

  function hmToast(msg){ hmToastEl.textContent=msg; hmToastEl.classList.add("show"); clearTimeout(hmToastEl._t); hmToastEl._t=setTimeout(()=>hmToastEl.classList.remove("show"),2200); }

  const HM_CLUSTER_PX = 34;
  const HM_MAX_MAP_WIDTH_PX = 2600;
  const HM_DECLUSTER_MAP_PX = 2300;
  const HM_LABEL_MAP_PX = 900;
  const HM_MIN_SCALE = 1;
  let hmDisplayWidth = 0;

  function hmToDisplay(spot){ return { dx: spot.x, dy: spot.y, visible: spot.x>=-3 && spot.x<=103 && spot.y>=-3 && spot.y<=103 }; }

  function hmBuildClusters(rect){
    const pts = [];
    HM_ALL.forEach(spot=>{ const p = hmToDisplay(spot); if(p.visible) pts.push({spot, dx:p.dx, dy:p.dy}); });
    const used = new Array(pts.length).fill(false);
    const groups = [];
    for(let i=0;i<pts.length;i++){
      if(used[i]) continue;
      used[i]=true;
      const g=[pts[i]];
      for(let j=i+1;j<pts.length;j++){
        if(used[j]) continue;
        const px=(pts[i].dx-pts[j].dx)/100*rect.width;
        const py=(pts[i].dy-pts[j].dy)/100*rect.height;
        if(Math.hypot(px,py) < HM_CLUSTER_PX){ used[j]=true; g.push(pts[j]); }
      }
      groups.push(g);
    }
    return groups;
  }

  function hmMakeSingleMarker(spot, dx, dy){
    const marker=document.createElement("div");
    marker.className="hm-marker"+(spot.type==="symbol"?" symbol":"");
    marker.dataset.dx=dx; marker.dataset.dy=dy; marker.dataset.key=spot.key;
    marker.innerHTML = `
      <svg viewBox="0 0 14 14"><circle class="hm-ring" cx="7" cy="7" r="6"></circle></svg>
      <div class="hm-marker-tag">${spot.label||""}</div>
      <div class="hm-marker-tooltip">${spot.name}</div>
    `;
    return marker;
  }
  function hmMakeClusterMarker(group){
    const dx = group.reduce((a,p)=>a+p.dx,0)/group.length;
    const dy = group.reduce((a,p)=>a+p.dy,0)/group.length;
    const el=document.createElement("div");
    el.className="hm-marker cluster";
    el.dataset.dx=dx; el.dataset.dy=dy;
    const names = group.slice(0,6).map(p=>p.spot.name).join("、") + (group.length>6 ? "…" : "");
    el.innerHTML = `<div class="hm-cluster-bubble">${group.length}</div><div class="hm-marker-tooltip">這一帶有 ${group.length} 個景點：${names}</div>`;
    return el;
  }

  function hmRepositionMarkers(){
    if(!window.__hmZoomAPI) return;
    const st = window.__hmZoomAPI.getState();
    if(!st.naturalBox) return;
    hmMarkerLayer.querySelectorAll(".hm-marker").forEach(el=>{
      const dx=parseFloat(el.dataset.dx), dy=parseFloat(el.dataset.dy);
      const nx = st.naturalBox.left + dx/100*st.naturalBox.width;
      const ny = st.naturalBox.top  + dy/100*st.naturalBox.height;
      el.style.left = (nx*st.scale + st.tx) + "px";
      el.style.top  = (ny*st.scale + st.ty) + "px";
    });
  }

  function hmRenderMarkers(){
    hmMarkerLayer.querySelectorAll(".hm-marker").forEach(el=>el.remove());
    const rect = hmMapStage.getBoundingClientRect();
    const sizeReady = rect.width > 50 && rect.height > 50;
    const atMaxZoom = hmDisplayWidth >= HM_DECLUSTER_MAP_PX;
    const groups = (!sizeReady || atMaxZoom) ? null : hmBuildClusters(rect);
    if(!groups){
      HM_ALL.forEach(spot=>{ const p = hmToDisplay(spot); if(p.visible) hmMarkerLayer.appendChild(hmMakeSingleMarker(spot, p.dx, p.dy)); });
    } else {
      groups.forEach(g=>{
        if(g.length===1) hmMarkerLayer.appendChild(hmMakeSingleMarker(g[0].spot, g[0].dx, g[0].dy));
        else hmMarkerLayer.appendChild(hmMakeClusterMarker(g));
      });
    }
    hmRepositionMarkers();
  }

  function hmSetMainPhoto(spot, idx){
    const p = spot.photos[idx];
    if(p){ hmGalleryMain.style.backgroundImage=`url(${p})`; hmGalleryMain.textContent=""; }
    else { hmGalleryMain.style.backgroundImage=""; hmGalleryMain.textContent="【照片佔位】"; }
    hmGalleryThumbs.querySelectorAll("img").forEach((im,i)=>im.classList.toggle("active", i===idx));
  }

  function hmOpenPanel(spot){
    if(spot.photos && spot.photos.length){
      hmGalleryThumbs.style.display="flex";
      hmGalleryThumbs.innerHTML = spot.photos.map((p,i)=>`<img src="${p}" data-i="${i}">`).join("");
      hmGalleryThumbs.querySelectorAll("img").forEach(im=>im.addEventListener("click",()=>hmSetMainPhoto(spot, parseInt(im.dataset.i,10))));
      hmSetMainPhoto(spot, 0);
    } else {
      hmGalleryThumbs.style.display="none"; hmGalleryThumbs.innerHTML="";
      hmSetMainPhoto(spot, -1);
    }
    hmPanelEyebrow.textContent = spot.type==="symbol" ? spot.name : `景點 ${spot.label||spot.key}`;
    hmPanelTitle.textContent = spot.name;
    hmPanelDesc.textContent = spot.desc;
    hmModalBackdrop.classList.add("show");
  }
  function hmCloseModal(){ hmModalBackdrop.classList.remove("show"); }
  document.getElementById("hmModalClose").addEventListener("click", hmCloseModal);
  hmModalBackdrop.addEventListener("click",(e)=>{ if(e.target===hmModalBackdrop) hmCloseModal(); });

  /* ---- 縮放／拖曳（雙指、滑鼠皆可） ---- */
  (function(){
    let scale = 1, tx = 0, ty = 0;
    let pointers = new Map();
    let prevMid = null, prevDist = 0;
    let moveDist = 0;
    let suppressClick = false;
    let naturalBox = null;

    function currentMaxScale(){
      if(!naturalBox || naturalBox.width < 10) return 4;
      return Math.max(1.5, HM_MAX_MAP_WIDTH_PX / naturalBox.width);
    }
    let renderPending = false;
    function scheduleRender(){
      if(renderPending) return;
      renderPending = true;
      requestAnimationFrame(()=>{ renderPending=false; hmRenderMarkers(); });
    }
    function measureNatural(){
      const prevTransform = hmMapViewport.style.transform;
      hmMapViewport.style.transform = "none";
      const sectionRect = hmMapSection.getBoundingClientRect();
      const stageRect = hmMapStage.getBoundingClientRect();
      hmMapViewport.style.transform = prevTransform;
      naturalBox = { left: stageRect.left - sectionRect.left, top: stageRect.top - sectionRect.top, width: stageRect.width, height: stageRect.height };
    }
    function clampPan(){
      if(!naturalBox || naturalBox.width<10 || naturalBox.height<10) return;
      const rect = hmMapSection.getBoundingClientRect();
      const contentLeft = naturalBox.left*scale+tx, contentTop = naturalBox.top*scale+ty;
      const contentRight = contentLeft+naturalBox.width*scale, contentBottom = contentTop+naturalBox.height*scale;
      if(naturalBox.width*scale <= rect.width){ tx += (rect.width-naturalBox.width*scale)/2 - contentLeft; }
      else { if(contentLeft>0) tx -= contentLeft; else if(contentRight<rect.width) tx += rect.width-contentRight; }
      if(naturalBox.height*scale <= rect.height){ ty += (rect.height-naturalBox.height*scale)/2 - contentTop; }
      else { if(contentTop>0) ty -= contentTop; else if(contentBottom<rect.height) ty += rect.height-contentBottom; }
    }
    function apply(reclusterNow){
      clampPan();
      hmMapViewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      const displayWidth = (naturalBox ? naturalBox.width : 0) * scale;
      hmDisplayWidth = displayWidth;
      hmMarkerLayer.classList.toggle("labels-on", displayWidth >= HM_LABEL_MAP_PX);
      hmRepositionMarkers();
      if(reclusterNow !== false) scheduleRender();
    }
    function clampScale(s){ return Math.min(currentMaxScale(), Math.max(HM_MIN_SCALE, s)); }
    function midOf(list){ const n=list.length; let x=0,y=0; list.forEach(p=>{x+=p.x;y+=p.y;}); return {x:x/n,y:y/n}; }
    function distOf(list){ const [a,b]=list; return Math.hypot(a.x-b.x, a.y-b.y); }
    function relPoint(e){ const rect=hmMapSection.getBoundingClientRect(); return {x:e.clientX-rect.left, y:e.clientY-rect.top}; }
    function resetTracking(){ const list=[...pointers.values()]; prevMid=list.length?midOf(list):null; prevDist=list.length===2?distOf(list):0; }
    function hideHint(){ hmZoomHintEl.classList.add("hide"); }

    hmMapSection.addEventListener("pointerdown",(e)=>{
      if(e.target.closest(".hm-zoom-controls")) return;
      hmMapSection.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, relPoint(e));
      moveDist = 0;
      hmMapViewport.classList.remove("animating");
      hmMapSection.classList.add("dragging");
      resetTracking();
    });
    hmMapSection.addEventListener("pointermove",(e)=>{
      if(!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, relPoint(e));
      const list=[...pointers.values()];
      if(!prevMid){ resetTracking(); return; }
      const mid = midOf(list);
      moveDist += Math.hypot(mid.x-prevMid.x, mid.y-prevMid.y);
      tx += mid.x-prevMid.x; ty += mid.y-prevMid.y;
      let scaleChanged=false;
      if(list.length===2){
        const d=distOf(list);
        if(prevDist>0){ const newScale=clampScale(scale*(d/prevDist)); const k=newScale/scale; tx=mid.x-(mid.x-tx)*k; ty=mid.y-(mid.y-ty)*k; scale=newScale; scaleChanged=true; }
        prevDist=d;
      }
      prevMid=mid;
      apply(scaleChanged);
      if(moveDist>4) hideHint();
    });
    function endPointer(e){
      pointers.delete(e.pointerId);
      const wasCleanTap = moveDist<=6 && pointers.size===0;
      if(moveDist>6){ suppressClick=true; setTimeout(()=>suppressClick=false,0); }
      if(pointers.size===0) hmMapSection.classList.remove("dragging");
      resetTracking();
      if(!wasCleanTap) return;
      const targetEl = document.elementFromPoint(e.clientX, e.clientY);
      if(!targetEl) return;
      const markerEl = targetEl.closest(".hm-marker");
      if(!markerEl) return;
      if(markerEl.classList.contains("cluster")){
        const dx=parseFloat(markerEl.dataset.dx), dy=parseFloat(markerEl.dataset.dy);
        zoomToPoint(dx, dy);
      } else {
        const spot = HM_ALL.find(s=>s.key===markerEl.dataset.key);
        if(spot) hmOpenPanel(spot);
      }
    }
    hmMapSection.addEventListener("pointerup", endPointer);
    hmMapSection.addEventListener("pointercancel", endPointer);
    hmMapSection.addEventListener("click",(e)=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);
    hmMapSection.addEventListener("wheel",(e)=>{
      e.preventDefault(); hideHint();
      if(e.ctrlKey || e.metaKey){
        const p = relPoint(e); const newScale = clampScale(scale*(1-e.deltaY*0.01)); const k=newScale/scale;
        tx = p.x-(p.x-tx)*k; ty = p.y-(p.y-ty)*k; scale=newScale; apply(true);
      } else { tx -= e.deltaX; ty -= e.deltaY; apply(false); }
    }, {passive:false});

    function zoomBy(factor){
      const rect = hmMapSection.getBoundingClientRect();
      const p = {x:rect.width/2, y:rect.height/2};
      const newScale = clampScale(scale*factor); const k=newScale/scale;
      tx = p.x-(p.x-tx)*k; ty = p.y-(p.y-ty)*k; scale=newScale;
      hmMapViewport.classList.add("animating"); apply(true); hideHint();
    }
    document.getElementById("hmZoomInBtn").addEventListener("click", ()=>zoomBy(1.5));
    document.getElementById("hmZoomOutBtn").addEventListener("click", ()=>zoomBy(1/1.5));
    hmMapSection.addEventListener("dblclick",(e)=>{
      hideHint();
      if(scale>1){ resetZoom(); return; }
      const p = relPoint(e);
      const newScale = clampScale(naturalBox ? 2300/naturalBox.width : 2.4), k=newScale/scale;
      tx=p.x-(p.x-tx)*k; ty=p.y-(p.y-ty)*k; scale=newScale;
      hmMapViewport.classList.add("animating"); apply(true);
    });
    function resetZoom(){ scale=1; tx=0; ty=0; hmMapViewport.classList.add("animating"); apply(true); }
    document.getElementById("hmZoomResetBtn").addEventListener("click", resetZoom);

    function zoomToPoint(dxPct, dyPct){
      const sectionRect = hmMapSection.getBoundingClientRect();
      const stageRect = hmMapStage.getBoundingClientRect();
      const p = { x: stageRect.left + dxPct/100*stageRect.width - sectionRect.left, y: stageRect.top + dyPct/100*stageRect.height - sectionRect.top };
      const newScale = clampScale(scale*2); const k=newScale/scale;
      tx = p.x-(p.x-tx)*k; ty = p.y-(p.y-ty)*k;
      tx += sectionRect.width/2 - p.x; ty += sectionRect.height/2 - p.y;
      scale = newScale;
      hmMapViewport.classList.add("animating"); apply(true); hideHint();
    }
    window.__hmZoomAPI = { zoomToPoint, resetZoom, measureNatural, getState: ()=>({scale, tx, ty, naturalBox}) };

    function remeasure(){
      const cw=100, ch=100;
      hmMapStage.style.aspectRatio = `${HM_BASE_W} / ${HM_BASE_H}`;
      measureNatural();
      hmRenderMarkers();
    }
    window.__hmRemeasure = remeasure;

    measureNatural();
    apply(true);
    window.addEventListener("resize", remeasure);
    if(hmMapImage.complete){ remeasure(); }
    hmMapImage.addEventListener("load", remeasure);
    hmMapImage.addEventListener("error", remeasure);
  })();
})();
</script>
