<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月明洞筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FDFCFA; --panel:#F6F4EF; --ink:#22241F; --pine:#33422F; --pine-soft:#5B6E52;
  --stone:#8D8577; --stone-soft:#C9C3B6; --accent:#A9754A;
  --font-display:"Noto Serif","Noto Serif KR","Noto Serif TC",serif;
  --font-body:"Noto Sans","Noto Sans KR","Noto Sans TC",sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink); font-family:var(--font-body); }
@supports (height: 100dvh){ html,body{ height:100dvh; } }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--stone-soft); flex-wrap:wrap; gap:10px; }
.brand{ font-family:var(--font-display); font-weight:600; font-size:19px; color:var(--pine); }
.brand small{ display:block; font-family:var(--font-body); font-weight:400; font-size:12px; color:var(--pine-soft); margin-top:2px; }
.topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.lang-switch{ display:flex; border:1px solid var(--stone-soft); border-radius:999px; overflow:hidden; }
.lang-switch button{ border:none; background:transparent; padding:6px 13px; font-size:12.5px; cursor:pointer; color:var(--pine-soft); }
.lang-switch button.active{ background:var(--pine); color:#fff; }

/* ---------- 分頁導覽（頁數不固定，按 PAGES 陣列自動長按鈕） ---------- */
.tab-nav{ display:flex; border:1px solid var(--stone-soft); border-radius:999px; overflow:hidden; flex-wrap:wrap; }
.tab-nav button{ border:none; background:transparent; padding:6px 14px; font-size:12.5px; cursor:pointer; color:var(--pine-soft); white-space:nowrap; }
.tab-nav button.active{ background:var(--accent); color:#fff; }

.calib-toggle{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--stone); border:1px dashed var(--stone-soft); padding:6px 12px; border-radius:999px; cursor:pointer; background:#fff; }
.calib-toggle.on{ border-color:var(--accent); color:var(--accent); background:#FBF3EC; }
.calib-toggle .dot{ width:7px; height:7px; border-radius:50%; background:var(--stone-soft); }
.calib-toggle.on .dot{ background:var(--accent); }

/* ---------- 地圖區（支援手機雙指縮放、拖曳平移，桌面滑鼠滾輪縮放） ---------- */
.map-wrap{ position:relative; height:calc(100% - 58px); min-height:340px; overflow:hidden; background:radial-gradient(circle at 50% 50%, #fff 0%, #F1EEE7 100%); cursor:grab; touch-action:none; }
.map-wrap.dragging{ cursor:grabbing; }
.map-viewport{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:24px; transform-origin:0 0; will-change:transform; }
.map-viewport.animating{ transition:transform .28s ease; }

/* ★不放 transform，圓點永遠是原生大小/位置，不會跟著地圖縮放糊掉 */
.marker-layer{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; touch-action:none; }

.zoom-controls{ position:absolute; right:16px; bottom:16px; z-index:25; display:flex; flex-direction:column; gap:6px; }
.zoom-controls button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--stone-soft); background:rgba(253,252,250,.95); box-shadow:0 4px 12px rgba(0,0,0,.15); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--pine); }
.zoom-controls button:hover{ background:#fff; border-color:var(--accent); color:var(--accent); }
.zoom-hint{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:20; font-size:11px; color:var(--stone); background:rgba(253,252,250,.9); padding:4px 10px; border-radius:999px; border:1px solid var(--stone-soft); pointer-events:none; opacity:.9; transition:opacity .4s ease; }
.zoom-hint.hide{ opacity:0; }

.map-stage{ position:relative; width:100%; max-width:1200px; overflow:hidden; box-shadow:0 10px 30px rgba(51,66,47,.12); border:1px solid var(--stone-soft); background:#EDEAE2; }
.map-image{ position:absolute; top:0; left:0; width:100%; height:auto; display:block; }

.marker{ position:absolute; width:14px; height:14px; transform:translate(-50%,-50%); cursor:pointer; z-index:5; pointer-events:auto; }
.marker svg{ width:100%; height:100%; overflow:visible; }
.marker .ring{ fill:rgba(51,66,47,.10); stroke:var(--pine); stroke-width:1.2; }
.marker:hover .ring{ fill:rgba(169,117,74,.28); stroke:var(--accent); }
.marker.active .ring{ fill:rgba(169,117,74,.4); stroke:var(--accent); stroke-width:1.6; }
.marker.calib-current .ring{ fill:rgba(169,117,74,.5); stroke:var(--accent); stroke-width:2; }
.marker.calib-current::after{ content:""; position:absolute; inset:-6px; border-radius:50%; border:1.5px dashed var(--accent); animation:pulse 1.1s infinite; }
@keyframes pulse{ 0%{transform:scale(.85);opacity:1;} 100%{transform:scale(1.6);opacity:0;} }
.marker-tag{ position:absolute; top:100%; left:50%; transform:translate(-50%,1px); font-size:9px; line-height:1; color:var(--pine); background:rgba(253,252,250,.78); padding:1px 3px; border-radius:2px; pointer-events:none; white-space:nowrap; opacity:0; transition:opacity .15s ease; }
/* 手機畫面小，49 個標籤在縮小狀態必然重疊，所以放大到夠近才顯示數字 */
.marker-layer.labels-on .marker-tag{ opacity:1; }
/* 電腦版螢幕大，地圖本來就顯示得夠大，數字一律顯示（維持原本的使用方式） */
@media (min-width: 700px){
  .marker-tag{ opacity:1; }
}
.marker.symbol .ring{ stroke:var(--pine-soft); stroke-dasharray:2,1.4; }
.marker.star{ cursor:default; }
.marker.star .star-shape{ fill:rgba(169,117,74,.25); stroke:var(--accent); stroke-width:1; }
.marker.star:hover .star-shape{ fill:rgba(169,117,74,.55); }
.marker.star.calib-current .star-shape{ fill:rgba(169,117,74,.65); stroke-width:1.4; }

/* 群組點：這一帶有好幾個景點時合併顯示，數字＝景點數量 */
.marker.cluster{ width:26px; height:26px; z-index:6; }
.cluster-bubble{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.28); border:2px solid rgba(255,255,255,.9); }
.marker.cluster:hover .cluster-bubble{ background:var(--pine); }
.marker-audio-badge{ position:absolute; top:-5px; right:-5px; width:9px; height:9px; border-radius:50%; background:var(--accent); font-size:7px; display:flex; align-items:center; justify-content:center; color:#fff; }
.marker-tooltip{ position:absolute; bottom:100%; left:50%; transform:translate(-50%,-4px); background:var(--ink); color:#fff; font-size:11px; padding:4px 8px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:20; }
.marker:hover .marker-tooltip{ opacity:.95; }

.calib-panel{ position:absolute; top:16px; left:16px; z-index:30; background:rgba(253,252,250,.97); border:1px solid var(--stone-soft); border-radius:10px; padding:14px 16px; width:250px; font-size:12.5px; box-shadow:0 6px 18px rgba(0,0,0,.08); display:none; }
.calib-panel.show{ display:block; }
.calib-panel h4{ margin:0 0 8px; font-family:var(--font-display); font-size:14px; color:var(--pine); }
.calib-current-row{ margin-bottom:8px; }
.calib-current-row strong{ color:var(--accent); }
.calib-nav{ display:flex; gap:6px; margin-bottom:10px; }
.calib-nav select{ flex:1; font-size:12px; padding:3px; }
.calib-nav button{ border:1px solid var(--stone-soft); background:#fff; border-radius:5px; padding:3px 8px; cursor:pointer; font-size:12px; }
.calib-export{ width:100%; background:var(--pine); color:#fff; border:none; border-radius:6px; padding:7px 0; cursor:pointer; font-size:12.5px; }
.calib-hint{ margin-top:8px; color:var(--stone); font-size:11px; line-height:1.6; }
.calib-readout{ position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:11.5px; padding:6px 12px; border-radius:6px; font-family:monospace; opacity:0; transition:opacity .2s ease; pointer-events:none; z-index:10; }
.calib-readout.show{ opacity:.92; }
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--pine); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s ease; pointer-events:none; z-index:100; }
.toast.show{ opacity:1; }


/* ================================================================
   彈出視窗（跳出式介紹卡片）—— 取代原本的側欄
   手機／桌面都用同一種樣式：置中的圓角白底卡片＋半透明遮罩
   ================================================================ */
.modal-backdrop{ position:fixed; inset:0; background:rgba(34,36,31,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.modal-backdrop.show{ opacity:1; pointer-events:auto; }
.modal-card{ background:var(--panel); width:100%; max-width:560px; max-height:86vh; overflow-y:auto; border-radius:20px 20px 0 0; position:relative; box-shadow:0 -12px 40px rgba(0,0,0,.3); transform:translateY(100%); transition:transform .32s ease; }
.modal-backdrop.show .modal-card{ transform:translateY(0); }

/* 電腦版（跟其他地方一樣用 700px 當斷點）：面板改成從右側滑出，不是從下面彈出 */
@media (min-width: 700px){
  .modal-backdrop{ align-items:stretch; justify-content:flex-end; }
  .modal-card{ width:420px; max-width:420px; height:100%; max-height:100%; border-radius:0; box-shadow:-12px 0 40px rgba(0,0,0,.3); transform:translateX(100%); }
  .modal-backdrop.show .modal-card{ transform:translateX(0); }
}
.modal-drag-handle{ position:sticky; top:0; display:flex; justify-content:center; padding:8px 0 4px; background:var(--panel); z-index:2; }
.modal-drag-handle span{ width:36px; height:4px; border-radius:99px; background:var(--stone-soft); display:block; }
.modal-close{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(255,255,255,.9); color:var(--ink); font-size:18px; cursor:pointer; z-index:5; box-shadow:0 2px 6px rgba(0,0,0,.15); }

.gallery-main{ width:100%; aspect-ratio:4/3; background:linear-gradient(135deg,#DCD6C7,#EDEAE2); display:flex; align-items:center; justify-content:center; color:var(--stone); font-size:12px; border-radius:20px 20px 0 0; background-size:cover; background-position:center; }
.gallery-thumbs{ display:flex; gap:6px; padding:8px 10px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--stone-soft); }
.gallery-thumbs img{ width:52px; height:52px; object-fit:cover; border-radius:4px; cursor:pointer; border:2px solid transparent; flex:0 0 auto; }
.gallery-thumbs img.active{ border-color:var(--accent); }

.panel-body{ padding:22px 26px 32px; }
.panel-top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.panel-eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.panel-title{ font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--pine); margin:0 0 10px; }
.audio-btn{ flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--stone-soft); background:#fff; cursor:pointer; font-size:14px; color:var(--pine); display:flex; align-items:center; justify-content:center; }
.audio-btn.playing{ background:var(--accent); color:#fff; border-color:var(--accent); }
.panel-rule{ border:none; border-top:1px solid var(--stone-soft); margin:12px 0 16px; }
.panel-desc{ font-size:14px; line-height:1.9; color:var(--ink); white-space:pre-line; }
.translation-note{ font-size:11px; color:var(--stone); margin-top:10px; font-style:italic; }

/* ---------- 地形照片分頁（單純瀏覽用，跟主地圖無關） ---------- */
.gallery-section{ height:calc(100% - 58px); overflow-y:auto; padding:24px; }
.gallery-grid{ max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.gallery-cell{ aspect-ratio:4/3; border-radius:10px; overflow:hidden; cursor:pointer; background:#EDEAE2; border:1px solid var(--stone-soft); }
.gallery-cell img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s ease; }
.gallery-cell:hover img{ transform:scale(1.05); }
.gallery-empty{ max-width:480px; margin:60px auto; text-align:center; color:var(--stone); font-size:13px; line-height:1.9; border:1px dashed var(--stone-soft); border-radius:12px; padding:40px 20px; }

/* ---------- 燈箱：點地形照片放大看 ---------- */
.lightbox-backdrop{ position:fixed; inset:0; background:rgba(20,21,18,.9); z-index:70; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; }
.lightbox-backdrop.show{ opacity:1; pointer-events:auto; }
.lightbox-backdrop img{ max-width:92vw; max-height:86vh; object-fit:contain; border-radius:6px; }
.lightbox-close{ position:absolute; top:16px; right:20px; background:transparent; border:none; color:#fff; font-size:28px; cursor:pointer; }
.lightbox-nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); border:none; color:#fff; font-size:22px; width:44px; height:44px; border-radius:50%; cursor:pointer; }
.lightbox-nav.prev{ left:16px; } .lightbox-nav.next{ right:16px; }

/* ---------- 影片分頁 ---------- */
.video-section{ height:calc(100% - 58px); display:flex; align-items:center; justify-content:center; padding:24px; background:#12130f; }
.video-stage{ width:100%; max-width:1100px; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
.video-stage video, .video-stage iframe{ width:100%; height:100%; display:block; border:none; }
.video-stage .gallery-empty{ color:var(--stone-soft); border-color:#3a3c34; margin:0; }

@media (max-width: 600px){
  .modal-card{ max-height:90vh; }
  .calib-panel{ width:180px; font-size:11.5px; }
  .gallery-grid{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">月明洞筆記
    <small id="brandTagline">戶外導覽地圖 mockup — 點擊圓點查看景點介紹</small>
  </div>
  <div class="topbar-right">

    <!-- ============================================================
         ★ 英文／韓文切換：目前先註解掉不顯示（現階段只做中文）
         之後真的要開放英韓文時，把下面這個 <div class="lang-switch">
         整塊的註解拿掉即可，程式邏輯（getText/翻譯 fallback）都還在，
         不用重寫。
         ============================================================ -->
    <!--
    <div class="lang-switch" id="langSwitch">
      <button data-lang="zh">中文</button>
      <button data-lang="en">EN</button>
      <button data-lang="ko">한국어</button>
    </div>
    -->

    <!-- 分頁導覽：按下面 JS 的 PAGES 陣列自動長出按鈕，要加減分頁只改 PAGES 就好 -->
    <div class="tab-nav" id="tabNav"></div>

    <div class="calib-toggle" id="calibToggle"><span class="dot"></span><span>校準座標模式</span></div>
  </div>
</div>

<!-- ============ 分頁 1：主地圖（互動圓點＋介紹，支援手機雙指縮放/拖曳） ============ -->
<div class="map-wrap" id="mapSection">
  <div class="map-viewport" id="mapViewport">
    <div class="map-stage" id="mapStage">
      <img class="map-image" id="mapImage" src="bg.webp" alt="園區地圖底圖">
    </div>
  </div>

  <!-- ★圓點圖層獨立在外面，不會被地圖的縮放 transform 影響，永遠用原生解析度畫，
       這樣放大縮小時圓點/文字都不會糊（糊的問題是底圖影像放大本身的物理限制，
       跟圓點是兩回事，圓點在這裡處理後就不該再糊了） -->
  <div class="marker-layer" id="markerLayer"></div>

  <!-- 校準面板放在縮放容器「外面」，才不會跟著地圖一起被放大縮小 -->
  <div class="calib-panel" id="calibPanel">
    <h4>校準座標</h4>
    <div class="calib-current-row">目前選取：<strong id="calibCurrentLabel">—</strong></div>
    <div class="calib-nav">
      <button id="calibPrev">←</button>
      <select id="calibSelect"></select>
      <button id="calibNext">→</button>
    </div>
    <button class="calib-export" id="calibExport">複製全部座標</button>
    <div class="calib-hint">點地圖＝設定「目前選取」的座標，設定後自動跳下一個。標完按「複製全部座標」，貼回程式碼取代對應的 x/y 即可。（可以先放大再點，會更準）</div>
  </div>
  <div class="zoom-controls">
    <button id="zoomInBtn" title="放大">＋</button>
    <button id="zoomOutBtn" title="縮小">－</button>
    <button class="zoom-reset-btn" id="zoomResetBtn" title="回到整張地圖">⤢</button>
  </div>
  <div class="zoom-hint" id="zoomHint">雙指放大地圖，靠近後會顯示景點編號</div>
</div>

<!-- ============ 分頁 2~N：地形照片（純瀏覽，點圖放大） ============ -->
<div class="gallery-section" id="gallerySection" style="display:none;">
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<!-- ============ 分頁：影片／稜線動畫 ============ -->
<div class="video-section" id="videoSection" style="display:none;">
  <div class="video-stage" id="videoStage"></div>
</div>

<!-- 燈箱：地形照片點下去放大看 -->
<div class="lightbox-backdrop" id="lightboxBackdrop">
  <button class="lightbox-nav prev" id="lightboxPrev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav next" id="lightboxNext">›</button>
  <button class="lightbox-close" id="lightboxClose">×</button>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalCard">
    <div class="modal-drag-handle"><span></span></div>
    <button class="modal-close" id="modalClose">×</button>
    <div class="gallery-main" id="galleryMain">【照片佔位】</div>
    <div class="gallery-thumbs" id="galleryThumbs" style="display:none;"></div>
    <div class="panel-body">
      <div class="panel-top-row">
        <div>
          <div class="panel-eyebrow" id="panelEyebrow">SPOT 01</div>
          <h2 class="panel-title" id="panelTitle">景點名稱</h2>
        </div>
        <button class="audio-btn" id="audioBtn" style="display:none;">▶</button>
      </div>
      <audio id="audioEl"></audio>
      <hr class="panel-rule">
      <p class="panel-desc" id="panelDesc">景點介紹文字佔位。</p>
      <div class="translation-note" id="translationNote" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   整體架構：網站現在是「分頁」結構（見下面的 PAGES 陣列）。
   第一頁固定是主地圖（互動圓點），資料就是這裡的 SPOTS_MAP1／
   SYMBOLS_MAP1。第二頁以後（地形照片、影片）都在 PAGES 那邊設定，
   跟主地圖的點位資料完全分開、互不影響。
   ================================================================ */

/* ----------------------------------------------------------------
   ★★★ 要幫某一筆補「照片／長文字／語音」時，直接複製下面這個範例，
   蓋掉對應那一筆就好（key 對到哪個就改哪個）：

   {key:"pt05", x:53.2, y:62.0, label:"05", name:"韓屋井",
     desc:"這裡貼正式的中文介紹文字，可以很長，換行也可以，不會影響版面。",
     photos:["photos/pt05-a.jpg","photos/pt05-b.jpg","photos/pt05-c.jpg"],
     audio:"audio/pt05.mp3"
   },

   - desc 沒寫 → 會自動顯示「站位文字」
   - photos 沒寫，或寫 [] → 面板顯示「照片佔位」，不會出錯
   - audio 沒寫，或寫 null → 不會出現播放鍵，不會出錯
   - name_en / name_ko / desc_en / desc_ko 都是選填，現階段先不用管
   ---------------------------------------------------------------- */
/* ============ 地圖模式 1：手繪地圖 ─ 這裡放地圖1（主要那張）的點位 ============ */
const SPOTS_MAP1 = [
  {key:"pt01",x:51.7,y:80.6,label:"01",name:"316空提紀念館",
    name_en:"316 Rapture Memorial Hall",
    name_ko:"성자 사랑의 집 (316 휴거 기념관)",

/* ================================================================
   ★ 標記群集（clustering）
   ----------------------------------------------------------------
   問題：49 個點在縮小狀態下，實際螢幕距離只有幾個 pixel，一定會擠成一團。
   解法：計算每個點「在螢幕上」的實際距離，太近的自動合併成一個群組點，
   上面顯示這裡有幾個景點。放大之後距離被拉開，群組會自動散開成單獨的點。
   ★ 這不會動到任何座標資料，純粹是顯示層的處理。
   ★ 校準模式下會自動關閉群集，確保每個點都能單獨點到。
   ================================================================ */
const CLUSTER_PX = 34;   // 螢幕上相距小於這個 px 就合併，數字越大合併越積極
/* ★縮放上限不能用「倍率」來定，因為同樣的倍率在不同裝置上是完全不同的東西：
   電腦上地圖原本就顯示成約 1200px 寬，放 3 倍就變 3600px（太大）；
   手機上地圖原本只有約 342px 寬，放 3 倍才 1026px（根本不夠）。
   所以改成用「地圖放大後實際顯示成多寬」當標準，上限由程式依裝置自動換算：
   ── 手機自然會算出約 7 倍，電腦約 2 倍，兩邊的實際使用體驗才一致。 */
const MAX_MAP_WIDTH_PX  = 2600;   // 放到最大時，地圖顯示的寬度（最近兩點約可分開 36px）
const DECLUSTER_MAP_PX  = 2300;   // 地圖顯示寬度超過這個值就完全不群集
const LABEL_MAP_PX      = 900;    // 地圖顯示寬度超過這個值才顯示數字標籤
const MIN_SCALE = 1;
window.__mapScale = 1;   // 目前縮放倍率，renderMarkers 會讀這個決定要不要群集
window.__mapDisplayWidth = 0;   // 目前地圖實際顯示的寬度（px）

function buildClusters(rect){
  const pts = [];
  ALL.forEach(spot=>{
    const p = toDisplay(spot);
    if(p.visible) pts.push({spot, dx:p.dx, dy:p.dy});
  });
  const used = new Array(pts.length).fill(false);
  const groups = [];
  for(let i=0;i<pts.length;i++){
    if(used[i]) continue;
    used[i]=true;
    const g=[pts[i]];
    for(let j=i+1;j<pts.length;j++){
      if(used[j]) continue;
      const px=(pts[i].dx-pts[j].dx)/100*rect.width;
      const py=(pts[i].dy-pts[j].dy)/100*rect.height;
      if(Math.hypot(px,py) < CLUSTER_PX){ used[j]=true; g.push(pts[j]); }
    }
    groups.push(g);
  }
  return groups;
}

function makeSingleMarker(spot, dx, dy){
  const marker=document.createElement("div");
  marker.className="marker"+(spot.type==="symbol"?" symbol":"")+(spot.type==="star"?" star":"");
  marker.dataset.dx=dx; marker.dataset.dy=dy;
  marker.dataset.key=spot.key;
  const shapeSvg = spot.type==="star"
    ? `<svg viewBox="0 0 14 14"><polygon class="star-shape" points="7,0.8 8.7,5.1 13.3,5.3 9.7,8.2 10.9,12.6 7,10.1 3.1,12.6 4.3,8.2 0.7,5.3 5.3,5.1"></polygon></svg>`
    : `<svg viewBox="0 0 14 14"><circle class="ring" cx="7" cy="7" r="6"></circle></svg>`;
  marker.innerHTML = `
    ${shapeSvg}
    ${spot.audio ? '<div class="marker-audio-badge">♪</div>' : ''}
    <div class="marker-tag">${spot.label||""}</div>
    <div class="marker-tooltip">${getText(spot,"name",currentLang)}</div>
  `;
  return marker;
}

function makeClusterMarker(group){
  const dx = group.reduce((a,p)=>a+p.dx,0)/group.length;
  const dy = group.reduce((a,p)=>a+p.dy,0)/group.length;
  const el=document.createElement("div");
  el.className="marker cluster";
  el.dataset.dx=dx; el.dataset.dy=dy;
  const names = group.slice(0,6).map(p=>getText(p.spot,"name",currentLang)).join("、")
              + (group.length>6 ? "…" : "");
  el.innerHTML = `
    <div class="cluster-bubble">${group.length}</div>
    <div class="marker-tooltip">這一帶有 ${group.length} 個景點：${names}</div>
  `;
  return el;
}

/* ★把圓點實際定位到畫面上的正確像素位置。
   這個函式刻意跟「建立圓點 DOM」（renderMarkers）分開：
   - renderMarkers：資料/群集有變化時才需要重新蓋 DOM（比較貴）
   - repositionMarkers：純粹縮放/拖曳時每一格畫面都要呼叫（要夠輕量），
     只是搬動既有 DOM 元素的 left/top，不重建內容，才不會頓。
   圓點本身永遠是原生 14px 大小，不會被地圖的縮放 transform 影響到，
   這是解決「放大會糊」的關鍵——圓點根本不在會被縮放的圖層裡面。 */
function repositionMarkers(){
  if(!window.__zoomAPI) return;
  const st = window.__zoomAPI.getState();
  if(!st.naturalBox) return;
  markerLayer.querySelectorAll(".marker").forEach(el=>{
    const dx=parseFloat(el.dataset.dx), dy=parseFloat(el.dataset.dy);
    const nx = st.naturalBox.left + dx/100*st.naturalBox.width;
    const ny = st.naturalBox.top  + dy/100*st.naturalBox.height;
    el.style.left = (nx*st.scale + st.tx) + "px";
    el.style.top  = (ny*st.scale + st.ty) + "px";
  });
}

function renderMarkers(){
  markerLayer.querySelectorAll(".marker").forEach(el=>el.remove());
  const rect = mapStage.getBoundingClientRect();
  /* ★重要防呆：底圖還沒載入完成時，容器寬高會是 0，這時候算出來的
     「螢幕距離」全部都是 0，會導致所有點被誤判成同一群、整張地圖
     只剩一顆球。所以尺寸還沒準備好時，一律不群集。 */
  const sizeReady = rect.width > 50 && rect.height > 50;
  /* ★地圖顯示寬度超過 DECLUSTER_MAP_PX 時，一律不群集，全部點單獨顯示。
     用「顯示寬度」而不是「倍率」判斷，手機和電腦才會在對等的實際大小下解散。 */
  const atMaxZoom = window.__mapDisplayWidth >= DECLUSTER_MAP_PX;
  // 校準模式：不群集，每個點都要能單獨點到
  const groups = (calibMode || !sizeReady || atMaxZoom) ? null : buildClusters(rect);

  if(!groups){
    ALL.forEach(spot=>{
      const p = toDisplay(spot);
      if(p.visible) markerLayer.appendChild(makeSingleMarker(spot, p.dx, p.dy));
    });
  } else {
    groups.forEach(g=>{
      if(g.length===1) markerLayer.appendChild(makeSingleMarker(g[0].spot, g[0].dx, g[0].dy));
      else markerLayer.appendChild(makeClusterMarker(g));
    });
  }
  repositionMarkers();   // 蓋完 DOM 立刻定位到正確的螢幕像素位置
  if(calibMode) highlightCalibCurrent();
}

function setMainPhoto(spot, idx){
  const p = spot.photos[idx];
  if(p){ galleryMain.style.backgroundImage=`url(${p})`; galleryMain.textContent=""; }
  else { galleryMain.style.backgroundImage=""; galleryMain.textContent=UI[currentLang].photo; }
  galleryThumbs.querySelectorAll("img").forEach((im,i)=>im.classList.toggle("active", i===idx));
}

function openPanel(spot){
  currentOpenKey = spot.key;

  if(spot.photos && spot.photos.length){
    galleryThumbs.style.display="flex";
    galleryThumbs.innerHTML = spot.photos.map((p,i)=>`<img src="${p}" data-i="${i}">`).join("");
    galleryThumbs.querySelectorAll("img").forEach(im=>im.addEventListener("click",()=>setMainPhoto(spot, parseInt(im.dataset.i,10))));
    setMainPhoto(spot, 0);
  } else {
    galleryThumbs.style.display="none"; galleryThumbs.innerHTML="";
    setMainPhoto(spot, -1);
  }

  panelEyebrow.textContent = spot.type==="symbol" ? getText(spot,"name",currentLang) : `${UI[currentLang].spot} ${spot.label||spot.key}`;
  panelTitle.textContent = getText(spot,"name",currentLang);
  panelDesc.textContent = getText(spot,"desc",currentLang);

  if(!isTranslated(spot,"name",currentLang) || !isTranslated(spot,"desc",currentLang)){
    translationNote.style.display="block"; translationNote.textContent = UI[currentLang].pending;
  } else { translationNote.style.display="none"; }

  audioEl.pause(); audioBtn.classList.remove("playing"); audioBtn.textContent="▶";
  if(spot.audio){
    audioBtn.style.display="flex";
    audioEl.src = spot.audio;
    audioBtn.onclick = ()=>{
      if(audioEl.paused){ audioEl.play(); audioBtn.classList.add("playing"); audioBtn.textContent="❚❚"; }
      else { audioEl.pause(); audioBtn.classList.remove("playing"); audioBtn.textContent="▶"; }
    };
  } else { audioBtn.style.display="none"; }

  modalBackdrop.classList.add("show");
}

function closeModal(){
  modalBackdrop.classList.remove("show");
  currentOpenKey=null;
  audioEl.pause();
}
document.getElementById("modalClose").addEventListener("click", closeModal);
modalBackdrop.addEventListener("click",(e)=>{ if(e.target===modalBackdrop) closeModal(); });

/* ---------------- 分頁切換（PAGES 陣列驅動，加減頁不用改這裡） ---------------- */
function buildTabNav(){
  tabNavEl.innerHTML = PAGES.map(p=>`<button data-key="${p.key}" class="${p.key===currentPageKey?'active':''}">${p.label}</button>`).join("");
}
tabNavEl.addEventListener("click",(e)=>{
  const btn=e.target.closest("button[data-key]"); if(!btn) return;
  switchPage(btn.dataset.key);
});
function switchPage(key){
  currentPageKey = key;
  const page = PAGES.find(p=>p.key===key);
  buildTabNav();
  closeModal(); closeLightbox();

  mapSection.style.display    = page.type==="map"     ? "flex" : "none";
  gallerySection.style.display= page.type==="gallery" ? "block": "none";
  videoSection.style.display  = page.type==="video"   ? "flex" : "none";
  // 校準工具只跟主地圖有關，切到其他分頁就先藏起來
  calibToggle.style.display = (page.type==="map" && IS_DEV) ? "flex" : "none";

  if(page.type==="gallery") renderGallery(page);
  if(page.type==="video")   renderVideo(page);
}

/* ---------------- 地形照片頁：純瀏覽用的照片牆 ---------------- */
function renderGallery(page){
  if(!page.photos || !page.photos.length){
    galleryGrid.style.display="none";
    galleryGrid.parentElement.querySelectorAll(".gallery-empty").forEach(el=>el.remove());
    const empty=document.createElement("div");
    empty.className="gallery-empty";
    empty.textContent = `「${page.label}」還沒有收集到照片，之後把照片路徑加進 PAGES 裡這一頁的 photos 陣列即可。`;
    gallerySection.appendChild(empty);
    return;
  }
  gallerySection.querySelectorAll(".gallery-empty").forEach(el=>el.remove());
  galleryGrid.style.display="grid";
  galleryGrid.innerHTML = page.photos.map((p,i)=>`<div class="gallery-cell" data-i="${i}"><img src="${p}" loading="lazy" alt="${page.label}"></div>`).join("");
  galleryGrid.querySelectorAll(".gallery-cell").forEach(cell=>{
    cell.addEventListener("click", ()=> openLightbox(page.photos, parseInt(cell.dataset.i,10)));
  });
}

/* ---------------- 燈箱：地形照片點下去放大看，可左右切換 ---------------- */
let lightboxPhotos=[], lightboxIndex=0;
function openLightbox(photos, idx){
  lightboxPhotos=photos; lightboxIndex=idx;
  lightboxImg.src = photos[idx];
  lightboxBackdrop.classList.add("show");
}
function closeLightbox(){ lightboxBackdrop.classList.remove("show"); }
function lightboxStep(delta){
  if(!lightboxPhotos.length) return;
  lightboxIndex = (lightboxIndex + delta + lightboxPhotos.length) % lightboxPhotos.length;
  lightboxImg.src = lightboxPhotos[lightboxIndex];
}
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightboxPrev").addEventListener("click", ()=>lightboxStep(-1));
document.getElementById("lightboxNext").addEventListener("click", ()=>lightboxStep(1));
lightboxBackdrop.addEventListener("click",(e)=>{ if(e.target===lightboxBackdrop) closeLightbox(); });

/* ---------------- 影片頁：mode 是 "local" 就放本機影片檔，是 "embed" 就內嵌第三方連結 ---------------- */
function renderVideo(page){
  const v = page.video || {};
  if(v.mode==="embed" && v.embedUrl){
    videoStage.innerHTML = `<iframe src="${v.embedUrl}" allow="autoplay; fullscreen" allowfullscreen title="${page.label}"></iframe>`;
  } else if(v.mode==="local" && v.src){
    videoStage.innerHTML = `<video controls ${v.poster?`poster="${v.poster}"`:""}><source src="${v.src}"></video>`;
  } else {
    videoStage.innerHTML = `<div class="gallery-empty">「${page.label}」還沒有設定影片來源，之後在 PAGES 裡這一頁的 video.src（或 video.embedUrl）填上即可。</div>`;
  }
}

/* ---------------- 裁切／縮放（換算成主地圖底圖的百分比） ---------------- */
function applyCrop(){
  const cw = CROP.right - CROP.left, ch = CROP.bottom - CROP.top;
  const cropWpx = baseW * cw / 100, cropHpx = baseH * ch / 100;
  mapStage.style.aspectRatio = `${cropWpx} / ${cropHpx}`;
  mapImage.style.width = (10000 / cw) + "%";
  mapImage.style.left = (-(CROP.left / cw * 100)) + "%";
  mapImage.style.top  = (-(CROP.top  / ch * 100)) + "%";
}
function toDisplay(spot){
  const cw = CROP.right - CROP.left, ch = CROP.bottom - CROP.top;
  const dx = (spot.x - CROP.left) / cw * 100;
  const dy = (spot.y - CROP.top)  / ch * 100;
  return { dx, dy, visible: dx >= -3 && dx <= 103 && dy >= -3 && dy <= 103 };
}

/* ---------------- 校準模式 ---------------- */
function buildCalibSelect(){
  calibSelect.innerHTML = ALL.map((s,i)=>`<option value="${i}">${s.label||s.key}｜${getText(s,"name",currentLang)}</option>`).join("");
  calibSelect.value=calibIndex;
  calibCurrentLabel.textContent = ALL.length ? (ALL[calibIndex].label||ALL[calibIndex].key)+"｜"+getText(ALL[calibIndex],"name",currentLang) : "—";
}
function highlightCalibCurrent(){
  document.querySelectorAll(".marker").forEach(m=>m.classList.remove("calib-current"));
  if(!ALL.length) return;
  const el=document.querySelector(`.marker[data-key="${ALL[calibIndex].key}"]`);
  if(el) el.classList.add("calib-current");
}
calibSelect.addEventListener("change",()=>{ calibIndex=parseInt(calibSelect.value,10); highlightCalibCurrent(); calibCurrentLabel.textContent=(ALL[calibIndex].label||ALL[calibIndex].key)+"｜"+getText(ALL[calibIndex],"name",currentLang); });
document.getElementById("calibPrev").addEventListener("click",()=>{ calibIndex=(calibIndex-1+ALL.length)%ALL.length; buildCalibSelect(); highlightCalibCurrent(); });
document.getElementById("calibNext").addEventListener("click",()=>{ calibIndex=(calibIndex+1)%ALL.length; buildCalibSelect(); highlightCalibCurrent(); });

calibToggle.addEventListener("click",()=>{
  calibMode=!calibMode; calibToggle.classList.toggle("on", calibMode); calibPanel.classList.toggle("show", calibMode);
  renderMarkers();   // 校準模式要關閉群集，離開時再恢復
  if(calibMode){ buildCalibSelect(); highlightCalibCurrent(); }
  else{ document.querySelectorAll(".marker").forEach(m=>m.classList.remove("calib-current")); }
});

let calibReadout;
function performCalibClick(clientX, clientY, targetEl){
  if(!calibMode || !ALL.length) return;
  if(targetEl && targetEl.closest && (targetEl.closest(".marker") || targetEl.closest(".calib-panel"))) return;
  const rect=mapStage.getBoundingClientRect();
  const dxPct=(clientX-rect.left)/rect.width*100;
  const dyPct=(clientY-rect.top)/rect.height*100;
  const cw=CROP.right-CROP.left, ch=CROP.bottom-CROP.top;
  const xPct=(CROP.left + dxPct*cw/100).toFixed(1);
  const yPct=(CROP.top  + dyPct*ch/100).toFixed(1);
  ALL[calibIndex].x=parseFloat(xPct); ALL[calibIndex].y=parseFloat(yPct);
  renderMarkers();
  if(!calibReadout){ calibReadout=document.createElement("div"); calibReadout.className="calib-readout"; mapStage.appendChild(calibReadout); }
  calibReadout.textContent = `${ALL[calibIndex].label||ALL[calibIndex].key} → x:${xPct}%  y:${yPct}%`;
  calibReadout.classList.add("show");
  clearTimeout(calibReadout._t); calibReadout._t=setTimeout(()=>calibReadout.classList.remove("show"),1400);
  calibIndex=(calibIndex+1)%ALL.length; buildCalibSelect(); highlightCalibCurrent();
}

/* ★複製到剪貼簿這件事在某些情況下會整個不能用（例如用區網 IP 而不是
   localhost/https 開網頁時，瀏覽器基於安全限制會直接不給用剪貼簿功能，
   而且失敗得無聲無息，連錯誤訊息都不會跳，比「複製失敗」更糟）。
   這裡改成：能用剪貼簿就直接複製；不能用，就跳出一個文字框讓你手動全選複製，
   保證不管什麼環境都拿得到內容，不會卡住。 */
function copyTextRobust(text, successMsg){
  function showFallback(){
    const bd=document.createElement("div");
    bd.style.cssText="position:fixed;inset:0;background:rgba(34,36,31,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;";
    bd.innerHTML=`
      <div style="background:var(--paper);border-radius:14px;padding:18px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3);">
        <div style="font-size:13px;color:var(--pine);margin-bottom:8px;">自動複製沒有成功，這裡手動全選（已經幫你選好了）再按 Cmd/Ctrl+C 複製：</div>
        <textarea readonly style="width:100%;height:220px;font-size:12px;font-family:monospace;padding:8px;box-sizing:border-box;"></textarea>
        <button style="margin-top:10px;padding:8px 16px;border-radius:8px;border:1px solid var(--stone-soft);background:#fff;cursor:pointer;">關閉</button>
      </div>`;
    document.body.appendChild(bd);
    const ta=bd.querySelector("textarea");
    ta.value=text;
    ta.focus(); ta.select();
    bd.querySelector("button").addEventListener("click",()=>bd.remove());
    bd.addEventListener("click",(e)=>{ if(e.target===bd) bd.remove(); });
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast(successMsg)).catch(showFallback);
    } else {
      showFallback();
    }
  }catch(err){ showFallback(); }
}

document.getElementById("calibExport").addEventListener("click",()=>{
  const line = s => `  {key:"${s.key}",x:${s.x},y:${s.y},label:"${s.label||""}",name:"${s.name}"}`;
  const out = `// ===== 主地圖座標更新（貼回去取代 x/y 就好）=====\n` + ALL.map(line).join(",\n");
  copyTextRobust(out, "已複製座標，貼回程式碼比對 x/y 即可");
});

/* ================================================================
   ★ 地圖縮放／平移（解決手機上節點擠成一團看不清楚的問題）
   ----------------------------------------------------------------
   原理：不去動任何景點的 x/y 座標，而是讓「整個地圖容器」可以被
   使用者用手勢放大、拖曳。放大之後，畫面上只會顯示某一小範圍，
   附近擠在一起的節點自然就會被撐開、變得好點。
   ★ 這一段跟座標資料完全獨立，以後不管怎麼改座標都不用動這裡。
   ================================================================ */
(function(){
  let scale = 1, tx = 0, ty = 0;
  let pointers = new Map();      // 目前按著的手指/滑鼠
  let prevMid = null, prevDist = 0;
  let moveDist = 0;              // 這次手勢總共移動了多少（用來分辨「點」還是「拖」）
  let suppressClick = false;

  /* 縮放上限依裝置動態計算：地圖自然寬度越小（手機），可放大的倍率就越大，
     這樣手機和電腦放到最大時，地圖的「實際顯示大小」是一致的。 */
  function currentMaxScale(){
    if(!naturalBox || naturalBox.width < 10) return 4;
    return Math.max(1.5, MAX_MAP_WIDTH_PX / naturalBox.width);
  }

  let renderPending = false;
  function scheduleRender(){
    if(renderPending) return;
    renderPending = true;
    requestAnimationFrame(()=>{ renderPending=false; renderMarkers(); });
  }

  let naturalBox = null;   // 地圖內容在「沒有縮放」狀態下，實際的位置與大小

  function measureNatural(){
    /* ★這裡是上一版算錯的地方：不能假設地圖內容剛好等於畫面大小。
       你的底圖是正方形，桌機視窗通常是「寬、矮」，所以就算沒放大，
       地圖本來就會比可視高度高，需要能往下捲動看到下半部。
       這裡改成：暫時拿掉 transform，直接量測地圖實際的位置和大小，
       量完再把 transform 加回去，這樣邊界限制才會抓對真正的範圍。 */
    const prevTransform = mapViewport.style.transform;
    mapViewport.style.transform = "none";
    const sectionRect = mapSection.getBoundingClientRect();
    const stageRect = mapStage.getBoundingClientRect();
    mapViewport.style.transform = prevTransform;
    naturalBox = {
      left: stageRect.left - sectionRect.left,
      top: stageRect.top - sectionRect.top,
      width: stageRect.width,
      height: stageRect.height
    };
  }

  function clampPan(){
    if(!naturalBox || naturalBox.width<10 || naturalBox.height<10) return;
    const rect = mapSection.getBoundingClientRect();
    /* 縮放後，地圖內容左上角、右下角實際會落在畫面上的哪裡 */
    const contentLeft   = naturalBox.left * scale + tx;
    const contentTop    = naturalBox.top  * scale + ty;
    const contentRight  = contentLeft + naturalBox.width  * scale;
    const contentBottom = contentTop  + naturalBox.height * scale;

    // 內容比畫面大的那一側，才限制拖動範圍；內容比畫面小的那一側，直接置中鎖住，不能拖
    if(naturalBox.width*scale <= rect.width){
      tx += (rect.width - naturalBox.width*scale)/2 - contentLeft;
    } else {
      if(contentLeft>0) tx -= contentLeft;
      else if(contentRight<rect.width) tx += rect.width-contentRight;
    }
    if(naturalBox.height*scale <= rect.height){
      ty += (rect.height - naturalBox.height*scale)/2 - contentTop;
    } else {
      if(contentTop>0) ty -= contentTop;
      else if(contentBottom<rect.height) ty += rect.height-contentBottom;
    }
  }

  function apply(reclusterNow){
    clampPan();
    mapViewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    const displayWidth = (naturalBox ? naturalBox.width : 0) * scale;
    window.__mapScale = scale;
    window.__mapDisplayWidth = displayWidth;   // 給 renderMarkers 判斷群集/標籤
    markerLayer.classList.toggle("labels-on", displayWidth >= LABEL_MAP_PX);
    repositionMarkers();   // ★每一格畫面都重新定位圓點的真實像素位置（輕量：只搬 left/top，不重建 DOM）
    if(reclusterNow !== false) scheduleRender();   // 縮放後重算群集，該散開的散開
  }

  function clampScale(s){ return Math.min(currentMaxScale(), Math.max(MIN_SCALE, s)); }

  function midOf(list){
    const n = list.length;
    let x=0,y=0; list.forEach(p=>{x+=p.x;y+=p.y;});
    return {x:x/n, y:y/n};
  }
  function distOf(list){
    const [a,b] = list;
    return Math.hypot(a.x-b.x, a.y-b.y);
  }
  function relPoint(e){
    const rect = mapSection.getBoundingClientRect();
    return { x: e.clientX-rect.left, y: e.clientY-rect.top };
  }

  function resetTracking(){
    const list=[...pointers.values()];
    prevMid = list.length ? midOf(list) : null;
    prevDist = list.length===2 ? distOf(list) : 0;
  }

  function hideHint(){ zoomHintEl.classList.add("hide"); }

  mapSection.addEventListener("pointerdown",(e)=>{
    /* ★浮在地圖上面的 UI 控制項（校準面板、縮放按鈕）點擊時，
       不要讓地圖的拖曳/縮放手勢去搶這個 pointer，
       不然這些按鈕會偶爾點不動，跟校準模式之前那個 bug 是同一種病。 */
    if(e.target.closest(".calib-panel, .zoom-controls, .zoom-hint")) return;
    mapSection.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, relPoint(e));
    moveDist = 0;
    mapViewport.classList.remove("animating");
    mapSection.classList.add("dragging");
    resetTracking();
  });

  mapSection.addEventListener("pointermove",(e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, relPoint(e));
    const list=[...pointers.values()];
    if(!prevMid){ resetTracking(); return; }

    const mid = midOf(list);
    moveDist += Math.hypot(mid.x-prevMid.x, mid.y-prevMid.y);
    tx += mid.x - prevMid.x;
    ty += mid.y - prevMid.y;

    let scaleChanged = false;
    if(list.length===2){
      const d = distOf(list);
      if(prevDist>0){
        const newScale = clampScale(scale * (d/prevDist));
        const k = newScale/scale;
        tx = mid.x - (mid.x - tx)*k;
        ty = mid.y - (mid.y - ty)*k;
        scale = newScale;
        scaleChanged = true;
      }
      prevDist = d;
    }
    prevMid = mid;
    apply(scaleChanged);   // 純拖曳時不重算群集，避免卡頓
    if(moveDist>4) hideHint();
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    const wasCleanTap = moveDist<=6 && pointers.size===0;
    if(moveDist>6){ suppressClick=true; setTimeout(()=>suppressClick=false, 0); }
    if(pointers.size===0) mapSection.classList.remove("dragging");
    resetTracking();
    /* ★地圖上所有「點一下」的判斷，統一在這裡處理，不再依賴瀏覽器自己合成的
       click 事件——因為 touch-action:none + setPointerCapture 這組合，
       在很多瀏覽器（不只手機，桌機也會）上會讓原生 click 不穩定觸發。
       這裡改成我們自己判斷「是否為單純點一下、沒有拖曳」，直接處理接下來
       該做什麼事，不管瀏覽器的 click 準不準都有效。 */
    if(!wasCleanTap) return;
    const targetEl = document.elementFromPoint(e.clientX, e.clientY);
    if(calibMode){
      performCalibClick(e.clientX, e.clientY, targetEl);
      return;
    }
    if(!targetEl) return;
    const markerEl = targetEl.closest(".marker");
    if(!markerEl) return;
    if(markerEl.classList.contains("cluster")){
      const dx=parseFloat(markerEl.dataset.dx), dy=parseFloat(markerEl.dataset.dy);
      if(window.__zoomAPI) window.__zoomAPI.zoomToPoint(dx, dy);
    } else {
      const spot = ALL.find(s=>s.key===markerEl.dataset.key);
      if(spot && spot.type!=="star") openPanel(spot);
    }
  }
  mapSection.addEventListener("pointerup", endPointer);
  mapSection.addEventListener("pointercancel", endPointer);

  // 拖曳幅度夠大的話，放開手指後不要誤觸發底下的景點點擊
  mapSection.addEventListener("click",(e)=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);

  /* 電腦版滑鼠滾輪：
     - 一般滾動 = 上下（或左右）移動地圖，維持你原本習慣的操作方式
     - Ctrl / ⌘ + 滾輪 = 縮放（也是觸控板雙指捏合會送出的事件） */
  mapSection.addEventListener("wheel",(e)=>{
    e.preventDefault();
    hideHint();
    if(e.ctrlKey || e.metaKey){
      const p = relPoint(e);
      const newScale = clampScale(scale * (1 - e.deltaY*0.01));
      const k = newScale/scale;
      tx = p.x - (p.x - tx)*k;
      ty = p.y - (p.y - ty)*k;
      scale = newScale;
      apply(true);
    } else {
      tx -= e.deltaX;
      ty -= e.deltaY;
      apply(false);
    }
  }, { passive:false });

  // 電腦版的縮放按鈕（不是每個人都知道 Ctrl+滾輪）
  function zoomBy(factor){
    const rect = mapSection.getBoundingClientRect();
    const p = { x: rect.width/2, y: rect.height/2 };
    const newScale = clampScale(scale*factor);
    const k = newScale/scale;
    tx = p.x - (p.x - tx)*k; ty = p.y - (p.y - ty)*k;
    scale = newScale;
    mapViewport.classList.add("animating");
    apply(true);
    hideHint();
  }
  document.getElementById("zoomInBtn").addEventListener("click", ()=>zoomBy(1.5));
  document.getElementById("zoomOutBtn").addEventListener("click", ()=>zoomBy(1/1.5));

  // 雙擊／雙擊放大縮小
  mapSection.addEventListener("dblclick",(e)=>{
    hideHint();
    if(scale>1){ resetZoom(); return; }
    const p = relPoint(e);
    // 雙擊直接跳到「全部點散開」的程度（依裝置換算，不用固定倍率）
    const newScale = clampScale(naturalBox ? DECLUSTER_MAP_PX/naturalBox.width : 2.4), k = newScale/scale;
    tx = p.x - (p.x - tx)*k; ty = p.y - (p.y - ty)*k;
    scale = newScale;
    mapViewport.classList.add("animating");
    apply(true);
  });

  function resetZoom(){
    scale=1; tx=0; ty=0;
    mapViewport.classList.add("animating");
    apply(true);
  }
  zoomResetBtn.addEventListener("click", resetZoom);

  /* 給群組點使用：點一個群組，就放大並把那一帶移到畫面中央，
     裡面的點就會散開成單獨的圓點。 */
  function zoomToPoint(dxPct, dyPct){
    const sectionRect = mapSection.getBoundingClientRect();
    const stageRect = mapStage.getBoundingClientRect();
    const p = {
      x: stageRect.left + dxPct/100*stageRect.width - sectionRect.left,
      y: stageRect.top  + dyPct/100*stageRect.height - sectionRect.top
    };
    const newScale = clampScale(scale * 2);
    const k = newScale/scale;
    tx = p.x - (p.x - tx)*k;
    ty = p.y - (p.y - ty)*k;
    // 再把該點移到畫面中央
    tx += sectionRect.width/2  - p.x;
    ty += sectionRect.height/2 - p.y;
    scale = newScale;
    mapViewport.classList.add("animating");
    apply(true);
    hideHint();
  }
  window.__zoomAPI = { zoomToPoint, resetZoom, measureNatural, getState: ()=>({scale, tx, ty, naturalBox}) };

  measureNatural();
  apply(true);   // 初始化：設定好標記縮放比例、標籤顯示狀態與群集

  // 切到別的分頁再切回主地圖時，維持上次的縮放位置即可，不用重置
})();

function remeasure(){ applyCrop(); if(window.__zoomAPI) window.__zoomAPI.measureNatural(); renderMarkers(); }

window.addEventListener("resize", remeasure);

calibToggle.style.display = IS_DEV ? "flex" : "none";   // 一開始就設定好，正式版不會閃一下才消失
buildTabNav();
applyCrop();
renderMarkers();
buildCalibSelect();

/* 底圖載入完成後，容器才會有正確的寬高，這時候重算一次版面、拖曳邊界與群集 */
if(mapImage.complete) { remeasure(); }
mapImage.addEventListener("load", remeasure);
mapImage.addEventListener("error", remeasure);
</script>

</body>
</html>
